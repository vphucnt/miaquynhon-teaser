<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Một tấm thiệp dành cho bạn · A card for you — Mia Quy Nhon</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="A festive card for you — Mia Quy Nhon">
  <meta property="og:description" content="Open your Christmas & New Year greeting from the Quy Nhơn coast.">
  <meta name="theme-color" content="#7E3D2C">
  <link rel="icon" href="assets/img/logo-terracotta.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/ecard.css">
</head>
<body class="viewer stage--christmas" id="viewer">
  <div class="viewer__glow"></div>
  <canvas class="fx" id="fx"></canvas>
  <img class="brandmark" src="assets/img/logo-white.png" alt="Mia Quy Nhon | Fusion Collection">
  <button class="sound" id="sound" type="button" aria-label="Sound" hidden></button>

  <main class="scene" id="scene">
    <div class="loading" id="loading"><p></p></div>

    <div class="envelope-wrap" id="envWrap" hidden>
      <p class="envelope-intro" id="envIntro"></p>
      <p class="envelope-from" id="envFrom"></p>
      <button class="envelope" id="envelope" type="button">
        <span class="envelope__back"></span>
        <span class="envelope__letter"></span>
        <span class="envelope__front"></span>
        <span class="envelope__flap"></span>
        <span class="envelope__seal">M</span>
        <span class="envelope__name" id="envName"></span>
      </button>
      <div class="tap"><span class="tap__dot"></span><span id="tapLabel"></span><small id="soundHint"></small></div>
    </div>

    <div class="card-wrap" id="cardWrap" hidden><div id="card"></div></div>
    <nav class="dock" id="dock">
      <button class="btn btn--light" id="replay" type="button"></button>
      <a class="btn btn--gold" id="createOwn" href="index.html"></a>
      <a class="btn btn--light" id="discover" target="_blank" rel="noopener"></a>
    </nav>
  </main>


  <script src="assets/js/config.js"></script>
  <script src="assets/js/themes.js"></script>
  <script src="assets/js/music.js"></script>
  <script src="assets/js/effects.js"></script>
  <script src="assets/js/viewer.js"></script>
</body>
</html>
