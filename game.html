<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Night Glide — Cánh chim đêm</title>
<style>
  :root {
    --night: #120C2E;
    --mint: #7EF0C8;
    --white: #FFFFFF;
    --outline: #1A1033;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #2A1F5C, var(--night) 70%);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  #stage {
    position: relative;
    aspect-ratio: 2 / 3;
    height: min(100vh, 150vw);
    max-height: 900px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 2px rgba(126, 240, 200, .25);
    border-radius: 6px;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  #back {
    position: absolute; top: 2.2%; left: 3.5%;
    height: 6%; display: flex; align-items: center;
    padding: 0 3%;
    border: 2px solid var(--mint); border-radius: 999px;
    background: rgba(26, 16, 51, .55);
    color: var(--white); text-decoration: none;
    font-size: clamp(9px, 1.5vh, 13px); font-weight: bold; letter-spacing: .06em;
  }
  #mute {
    position: absolute; top: 2.2%; right: 3.5%;
    width: 9%; aspect-ratio: 1;
    border: 2px solid var(--mint);
    border-radius: 50%;
    background: rgba(26, 16, 51, .55);
    color: var(--white);
    font-size: clamp(12px, 2.4vh, 20px);
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Night Glide game"></canvas>
  <a id="back" href="index.html" aria-label="Back">← Back</a>
  <button id="mute" type="button" aria-label="Toggle sound">♪</button>
</div>

<script>
(() => {
  'use strict';

  // ───────────────────────── Specs ─────────────────────────
  const W = 400, H = 600, FPS = 60, STEP = 1000 / FPS;
  const GROUND_H = 90;
  const GROUND_Y = H - GROUND_H;

  const BIRD_W = 60, BIRD_H = 45;
  const BIRD_X = 90;
  const GRAVITY = 0.5;
  const FLY_SPEED = -8;
  const MAX_FALL = 11;

  const COL_W = 72;          // column (pillar) width
  const GAP = 160;           // blank gap between upper and lower column
  const DISTANCE = 200;      // horizontal distance between consecutive columns
  const SPEED = 2;           // scroll speed (px per frame)
  const GAP_MIN_Y = 70;      // top of gap never higher than this
  const GAP_MAX_Y = GROUND_Y - GAP - 50;

  const C = {
    skyTop: '#1B1442', skyMid: '#3A2A78', skyLow: '#7A4A9E',
    moon: '#FFE3A8', hillFar: '#2A1F5C', hillNear: '#1E1648',
    mint: '#3FD9A8', mintLight: '#7EF0C8', mintDark: '#1C8F78', glow: '#7EF0C8',
    coral: '#FF7A6B', coralLight: '#FFA48F', coralDark: '#E0524A', beak: '#FFC857',
    cream: '#FFF3DD', outline: '#1A1033', white: '#FFFFFF', lilac: '#C9BCFF',
    ground: '#241A4E', groundStripe: '#33266B', panel: 'rgba(36,26,78,0.94)',
  };

  const STATE = { READY: 'ready', PLAY: 'play', OVER: 'over' };
  const HS_KEY = 'night-glide-best';

  // ───────────────────────── Canvas ─────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ───────────────────────── Audio (synthesised) ─────────────────────────
  const Sound = (() => {
    let ac = null, muted = false;
    const ensure = () => {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ac = new AC();
      }
      if (ac && ac.state === 'suspended') ac.resume();
      return ac;
    };
    function tone({ type = 'sine', from, to, dur, vol = 0.2, delay = 0 }) {
      if (muted || !ensure()) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(from, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }
    function noise(dur, vol) {
      if (muted || !ensure()) return;
      const len = Math.floor(ac.sampleRate * dur);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 900;
      g.gain.value = vol;
      src.buffer = buf;
      src.connect(f).connect(g).connect(ac.destination);
      src.start();
    }
    return {
      unlock: ensure,
      wing:  () => { tone({ type: 'triangle', from: 520, to: 880, dur: 0.09, vol: 0.12 }); },
      point: () => { tone({ from: 988, dur: 0.09, vol: 0.16 }); tone({ from: 1319, dur: 0.18, vol: 0.16, delay: 0.08 }); },
      hit:   () => { noise(0.18, 0.5); tone({ type: 'square', from: 220, to: 70, dur: 0.25, vol: 0.12 }); },
      die:   () => { tone({ type: 'sawtooth', from: 440, to: 110, dur: 0.5, vol: 0.08, delay: 0.22 }); },
      toggle() { muted = !muted; return muted; },
    };
  })();

  // ───────────────────────── World layers (parallax) ─────────────────────────
  const rand = (a, b) => a + Math.random() * (b - a);

  const clouds = Array.from({ length: 5 }, (_, i) => ({
    x: i * 110 + rand(0, 60), y: rand(40, 200), s: rand(0.6, 1.2),
  }));
  const hillPts = (() => {          // seamless distant ridge silhouette, 800px wide
    const pts = [];
    for (let x = 0; x <= 800; x += 40) pts.push(GROUND_Y - 120 + Math.sin(x / 800 * Math.PI * 4) * 22 + Math.sin(x / 800 * Math.PI * 10) * 9);
    return pts;
  })();

  let bgOffset = 0, hillOffset = 0, seaOffset = 0, groundOffset = 0;

  // ───────────────────────── Game objects ─────────────────────────
  const bird = { x: BIRD_X, y: 0, vy: 0, rot: 0, flapTimer: 0, frame: 0, t: 0 };
  let columns = [];
  let particles = [];
  let state = STATE.READY;
  let score = 0;
  let best = 0;
  try { best = Number(localStorage.getItem(HS_KEY)) || 0; } catch (e) { /* storage unavailable */ }
  let isNewBest = false;
  let overTimer = 0;       // frames since game over (input lock + panel animation)
  let flash = 0;           // white flash on impact
  let scorePulse = 0;

  function reset() {
    bird.y = H * 0.42; bird.vy = 0; bird.rot = 0; bird.flapTimer = 0; bird.t = 0;
    columns = [];
    particles = [];
    score = 0; isNewBest = false; overTimer = 0; flash = 0;
    state = STATE.READY;
  }

  function spawnColumn(x) {
    const gapY = Math.round(rand(GAP_MIN_Y, GAP_MAX_Y));
    columns.push({ x, gapY, passed: false });
  }

  function flap() {
    bird.vy = FLY_SPEED;
    bird.flapTimer = 14;
    Sound.wing();
    for (let i = 0; i < 4; i++) {
      particles.push({ x: bird.x - 18, y: bird.y + rand(-6, 10), vx: rand(-2.2, -0.8), vy: rand(-0.6, 0.8), life: 26, max: 26 });
    }
  }

  function gameOver() {
    if (state === STATE.OVER) return;
    state = STATE.OVER;
    flash = 1;
    Sound.hit(); Sound.die();
    if (score > best) { best = score; isNewBest = true; try { localStorage.setItem(HS_KEY, String(best)); } catch (e) { /* storage unavailable */ } }
  }

  // ───────────────────────── Input ─────────────────────────
  function press() {
    Sound.unlock();
    if (state === STATE.READY) {
      state = STATE.PLAY;
      spawnColumn(W + 40);
      flap();
    } else if (state === STATE.PLAY) {
      flap();
    } else if (state === STATE.OVER && overTimer > 35 && bird.y + BIRD_H / 2 >= GROUND_Y - 1) {
      reset();
    }
  }
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  const muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
  document.getElementById('back').addEventListener('pointerdown', e => e.stopPropagation());
  muteBtn.addEventListener('click', () => {
    const m = Sound.toggle();
    muteBtn.textContent = m ? '×' : '♪';
    muteBtn.blur();
  });

  // ───────────────────────── Collision ─────────────────────────
  // Slightly inset hitbox so contact feels fair with the rounded sprite.
  function birdBox() {
    const insetX = 9, insetY = 8;
    return { l: bird.x - BIRD_W / 2 + insetX, r: bird.x + BIRD_W / 2 - insetX, t: bird.y - BIRD_H / 2 + insetY, b: bird.y + BIRD_H / 2 - insetY };
  }
  function hitsColumn(c, bx) {
    if (bx.r <= c.x || bx.l >= c.x + COL_W) return false;
    return bx.t < c.gapY || bx.b > c.gapY + GAP;
  }

  // ───────────────────────── Update (fixed 60 FPS step) ─────────────────────────
  function update() {
    bird.t++;
    if (bird.flapTimer > 0) bird.flapTimer--;
    bird.frame = bird.flapTimer > 0 ? Math.floor(bird.t / 3) % 3 : 1;   // fast beats when flapping, glide otherwise

    if (state !== STATE.OVER) {
      bgOffset = (bgOffset + SPEED * 0.15) % W;
      hillOffset = (hillOffset + SPEED * 0.35) % 800;
      seaOffset = (seaOffset + SPEED * 0.6) % 40;
      groundOffset = (groundOffset + SPEED) % 32;
      for (const c of clouds) { c.x -= SPEED * 0.15 * c.s; if (c.x < -90) { c.x = W + rand(10, 80); c.y = rand(40, 200); } }
    }

    if (state === STATE.READY) {
      // Gentle hover — no gravity until the first input.
      bird.y = H * 0.42 + Math.sin(bird.t / 12) * 7;
      bird.rot = 0;
      if (bird.t % 30 === 0) bird.flapTimer = 12;
    } else if (state === STATE.PLAY) {
      bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
      bird.y += bird.vy;
      bird.rot = Math.max(-0.45, Math.min(1.35, bird.vy * 0.09));

      // Columns
      for (const c of columns) c.x -= SPEED;
      const last = columns[columns.length - 1];
      if (last && last.x <= W + 40 - (COL_W + DISTANCE)) spawnColumn(last.x + COL_W + DISTANCE);
      columns = columns.filter(c => c.x + COL_W > -10);

      // Scoring: bird passes the column's trailing edge
      for (const c of columns) {
        if (!c.passed && bird.x > c.x + COL_W) {
          c.passed = true; score++; scorePulse = 1; Sound.point();
        }
      }

      // Collisions
      const bx = birdBox();
      if (bx.t <= 0) { bird.y = BIRD_H / 2 - 8; gameOver(); }                 // ceiling
      else if (bx.b >= GROUND_Y) { bird.y = GROUND_Y - BIRD_H / 2 + 8; gameOver(); } // ground
      else if (columns.some(c => hitsColumn(c, bx))) gameOver();             // columns
    } else if (state === STATE.OVER) {
      overTimer++;
      // Bird tumbles to the ground; world is frozen.
      if (bird.y + BIRD_H / 2 < GROUND_Y) {
        bird.vy = Math.min(bird.vy + GRAVITY * 1.4, MAX_FALL * 1.3);
        bird.y = Math.min(bird.y + bird.vy, GROUND_Y - BIRD_H / 2);
        bird.rot = Math.min(bird.rot + 0.12, Math.PI / 2);
      } else {
        bird.rot = Math.PI / 2;
      }
    }

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
    particles = particles.filter(p => p.life > 0);
    if (flash > 0) flash = Math.max(0, flash - 0.06);
    if (scorePulse > 0) scorePulse = Math.max(0, scorePulse - 0.07);
  }

  // ───────────────────────── Drawing ─────────────────────────
  const FONT = '"Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif';

  const stars = Array.from({ length: 46 }, () => ({
    x: Math.random() * W, y: Math.random() * (GROUND_Y - 170), r: rand(0.6, 1.8), p: rand(0, Math.PI * 2),
  }));

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, C.skyTop);
    g.addColorStop(0.6, C.skyMid);
    g.addColorStop(1, C.skyLow);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND_Y);

    // Twinkling stars
    for (const s of stars) {
      const x = ((s.x - bgOffset * 0.5) % W + W) % W;
      ctx.fillStyle = `rgba(255,247,230,${0.45 + 0.4 * Math.sin(bird.t / 25 + s.p)})`;
      ctx.beginPath(); ctx.arc(x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }

    // Moon with glow
    const mx = 335 - bgOffset * 0.2, my = 92;
    const mg = ctx.createRadialGradient(mx, my, 10, mx, my, 95);
    mg.addColorStop(0, 'rgba(255,233,190,0.45)');
    mg.addColorStop(1, 'rgba(255,233,190,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(mx - 95, my - 95, 190, 190);
    ctx.fillStyle = C.moon;
    ctx.beginPath(); ctx.arc(mx, my, 28, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(230,196,140,0.55)';
    ctx.beginPath(); ctx.arc(mx - 9, my - 6, 5, 0, Math.PI * 2); ctx.arc(mx + 8, my + 9, 3.5, 0, Math.PI * 2); ctx.fill();

    // Drifting night clouds
    ctx.fillStyle = 'rgba(138,120,200,0.32)';
    for (const c of clouds) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
      ctx.beginPath();
      ctx.ellipse(0, 0, 36, 9, 0, 0, Math.PI * 2);
      ctx.ellipse(-12, -6, 16, 9, 0, 0, Math.PI * 2);
      ctx.ellipse(12, -8, 18, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawHills() {
    // Far ridge
    ctx.fillStyle = C.hillFar;
    for (const shift of [0, 800]) {
      ctx.beginPath();
      ctx.moveTo(-hillOffset + shift, GROUND_Y);
      hillPts.forEach((y, i) => ctx.lineTo(i * 40 - hillOffset + shift, y));
      ctx.lineTo(800 - hillOffset + shift, GROUND_Y);
      ctx.closePath(); ctx.fill();
    }
    // Near rolling hills (faster layer)
    ctx.fillStyle = C.hillNear;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= W; x += 10) {
      const wx = x + seaOffset * 10;
      ctx.lineTo(x, GROUND_Y - 34 - Math.sin(wx / 70) * 12 - Math.sin(wx / 23) * 3);
    }
    ctx.lineTo(W, GROUND_Y); ctx.closePath(); ctx.fill();
  }

  function drawPillar(x, top, bottom, capAtBottom) {
    const h = bottom - top;
    if (h <= 0) return;
    // Body
    const g = ctx.createLinearGradient(x, 0, x + COL_W, 0);
    g.addColorStop(0, C.mintDark);
    g.addColorStop(0.3, C.mint);
    g.addColorStop(0.55, C.mintLight);
    g.addColorStop(1, C.mintDark);
    ctx.fillStyle = g;
    ctx.fillRect(x, top, COL_W, h);

    // Facet lines
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 22, top); ctx.lineTo(x + 22, bottom);
    ctx.moveTo(x + 50, top); ctx.lineTo(x + 50, bottom);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(20,10,50,0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, top, COL_W - 2, h);

    // Glowing rounded cap at the gap edge
    const capH = 18, capX = x - 6, capW = COL_W + 12;
    const capY = capAtBottom ? bottom - capH : top;
    ctx.save();
    ctx.shadowColor = C.glow; ctx.shadowBlur = 14;
    ctx.fillStyle = C.mintLight;
    roundRect(capX, capY, capW, capH, 6); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(20,10,50,0.45)'; ctx.lineWidth = 2;
    roundRect(capX, capY, capW, capH, 6); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(capX + 8, capY + 4, capW - 30, 3);
  }

  function drawColumns() {
    for (const c of columns) {
      drawPillar(c.x, -20, c.gapY, true);
      drawPillar(c.x, c.gapY + GAP, GROUND_Y, false);
    }
  }

  function drawGround() {
    ctx.fillStyle = C.ground;
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);
    // Glowing edge
    ctx.fillStyle = C.mintLight;
    ctx.fillRect(0, GROUND_Y, W, 4);
    // Scrolling chevron track
    ctx.fillStyle = C.groundStripe;
    ctx.fillRect(0, GROUND_Y + 4, W, 18);
    ctx.fillStyle = C.coral;
    for (let x = -groundOffset; x < W + 32; x += 32) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 7); ctx.lineTo(x + 10, GROUND_Y + 7);
      ctx.lineTo(x + 18, GROUND_Y + 13); ctx.lineTo(x + 10, GROUND_Y + 19);
      ctx.lineTo(x, GROUND_Y + 19); ctx.lineTo(x + 8, GROUND_Y + 13);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, GROUND_Y + 22, W, 2);
    // Dots
    ctx.fillStyle = 'rgba(126,240,200,0.18)';
    for (let x = -groundOffset; x < W + 32; x += 16) {
      ctx.fillRect(x + 4, GROUND_Y + 42 + (Math.abs(Math.round(x / 16)) % 3) * 12, 3, 3);
    }
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    const w = BIRD_W, h = BIRD_H;

    // Tail feathers
    ctx.fillStyle = C.coralDark;
    ctx.beginPath();
    ctx.moveTo(-w * 0.26, 0);
    ctx.lineTo(-w * 0.5, -10);
    ctx.lineTo(-w * 0.42, 2);
    ctx.lineTo(-w * 0.5, 12);
    ctx.closePath(); ctx.fill();

    // Round body
    const bg = ctx.createRadialGradient(-4, -8, 4, 0, 0, w * 0.45);
    bg.addColorStop(0, C.coralLight);
    bg.addColorStop(1, C.coral);
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 1, w * 0.38, h * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.outline; ctx.lineWidth = 2; ctx.stroke();

    // Belly
    ctx.fillStyle = C.cream;
    ctx.beginPath(); ctx.ellipse(4, 8, w * 0.22, h * 0.2, 0, 0, Math.PI * 2); ctx.fill();

    // Crest
    ctx.fillStyle = C.coralDark;
    ctx.beginPath();
    ctx.moveTo(2, -h * 0.36); ctx.quadraticCurveTo(0, -h * 0.62, 10, -h * 0.56);
    ctx.quadraticCurveTo(8, -h * 0.44, 12, -h * 0.34); ctx.closePath(); ctx.fill();

    // Big eye
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(w * 0.17, -6, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.outline; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = C.outline;
    const blink = state !== STATE.OVER && bird.t % 180 < 6;
    if (blink) ctx.fillRect(w * 0.17 - 5, -6.5, 10, 2);
    else if (state === STATE.OVER) {
      ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(w * 0.17 - 3.5, -9.5); ctx.lineTo(w * 0.17 + 3.5, -2.5);
      ctx.moveTo(w * 0.17 + 3.5, -9.5); ctx.lineTo(w * 0.17 - 3.5, -2.5); ctx.stroke();
    } else { ctx.beginPath(); ctx.arc(w * 0.19, -6, 3.2, 0, Math.PI * 2); ctx.fill(); }

    // Beak
    ctx.fillStyle = C.beak;
    ctx.beginPath();
    ctx.moveTo(w * 0.3, -2); ctx.lineTo(w * 0.5, 2); ctx.lineTo(w * 0.3, 7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = C.outline; ctx.lineWidth = 1.5; ctx.stroke();

    // Wing — 3 frames: up, mid (glide/idle), down
    const angles = [-0.95, -0.15, 0.6];
    const a = state === STATE.OVER ? 0.3 : angles[bird.frame];
    ctx.save();
    ctx.translate(-4, 2);
    ctx.rotate(a);
    ctx.fillStyle = C.cream;
    ctx.beginPath();
    ctx.moveTo(6, 0);
    ctx.quadraticCurveTo(-4, -h * 0.42, -w * 0.34, -h * 0.16);
    ctx.quadraticCurveTo(-w * 0.16, 2, 6, 0);
    ctx.fill();
    ctx.strokeStyle = C.outline; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.fillStyle = `rgba(126,240,200,${(p.life / p.max) * 0.85})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2); ctx.fill();
    }
  }

  function text(str, x, y, { size = 20, color = C.white, align = 'center', weight = '', stroke = null, alpha = 1, spacing = 0 } = {}) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `${weight} ${size}px ${FONT}`.trim();
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    if ('letterSpacing' in ctx) ctx.letterSpacing = `${spacing}px`;
    if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.18; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawUI() {
    if (state === STATE.READY) {
      const bob = Math.sin(bird.t / 20) * 3;
      text('NIGHT', W / 2, 108 + bob, { size: 46, color: C.mintLight, stroke: C.outline, weight: 'bold', spacing: 4 });
      text('GLIDE', W / 2, 156 + bob, { size: 46, color: C.coral, stroke: C.outline, weight: 'bold', spacing: 4 });
      text('Cánh chim đêm', W / 2, 196, { size: 15, color: C.lilac, spacing: 1 });

      const blink = 0.55 + 0.45 * Math.sin(bird.t / 14);
      text('Press Space / Click to Play', W / 2, 372, { size: 18, color: C.white, weight: 'bold', stroke: C.outline, alpha: blink });
      text('Nhấn Space / Chạm màn hình để bắt đầu', W / 2, 400, { size: 13, color: C.lilac, alpha: blink });
      if (best > 0) text(`★ Best · Kỷ lục  ${best}`, W / 2, 446, { size: 15, color: C.moon, weight: 'bold' });
      return;
    }

    if (state === STATE.PLAY) {
      const s = 1 + scorePulse * 0.25;
      ctx.save(); ctx.translate(W / 2, 64); ctx.scale(s, s);
      text(String(score), 0, 0, { size: 54, color: C.white, stroke: C.outline, weight: 'bold' });
      ctx.restore();
      return;
    }

    // Game over panel slides in
    const k = Math.min(1, overTimer / 30);
    const ease = 1 - Math.pow(1 - k, 3);
    const py = 150 + (1 - ease) * 60;
    ctx.save();
    ctx.globalAlpha = ease;
    text('GAME OVER', W / 2, py - 40, { size: 40, color: C.coral, stroke: C.outline, weight: 'bold', spacing: 2 });

    ctx.fillStyle = C.panel;
    roundRect(60, py, W - 120, 170, 18); ctx.fill();
    ctx.strokeStyle = C.mintLight; ctx.lineWidth = 3; ctx.stroke();

    text('SCORE · ĐIỂM', W / 2, py + 28, { size: 12, color: C.lilac, weight: 'bold', spacing: 2 });
    text(String(score), W / 2, py + 62, { size: 42, color: C.white, weight: 'bold' });
    ctx.fillStyle = 'rgba(184,170,240,0.35)';
    ctx.fillRect(W / 2 - 50, py + 90, 100, 2);
    text('HIGH SCORE · KỶ LỤC', W / 2, py + 110, { size: 12, color: C.lilac, weight: 'bold', spacing: 2 });
    text(String(best), W / 2, py + 140, { size: 28, color: C.moon, weight: 'bold' });
    if (isNewBest && score > 0) {
      ctx.save(); ctx.translate(W - 82, py + 18); ctx.rotate(0.25);
      ctx.fillStyle = C.coral; roundRect(-30, -12, 60, 24, 12); ctx.fill();
      ctx.strokeStyle = C.outline; ctx.lineWidth = 2; ctx.stroke();
      text('NEW!', 0, 1, { size: 12, color: C.white, weight: 'bold', spacing: 1 });
      ctx.restore();
    }
    ctx.restore();

    // Replay button
    const ready = overTimer > 35 && bird.y + BIRD_H / 2 >= GROUND_Y - 1;
    if (ready) {
      const by = py + 196;
      ctx.fillStyle = C.mint;
      roundRect(W / 2 - 84, by, 168, 46, 23); ctx.fill();
      ctx.strokeStyle = C.outline; ctx.lineWidth = 3; ctx.stroke();
      text('↻  Replay · Chơi lại', W / 2, by + 23, { size: 16, color: C.outline, weight: 'bold' });
      text('Space / Click', W / 2, by + 64, { size: 12, color: C.lilac });
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawHills();
    drawColumns();
    drawGround();
    drawParticles();
    drawBird();
    drawUI();
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.8})`; ctx.fillRect(0, 0, W, H); }
  }

  // ───────────────────────── Loop ─────────────────────────
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 250);   // avoid spiral after tab switch
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    render();
    requestAnimationFrame(loop);
  }

  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
