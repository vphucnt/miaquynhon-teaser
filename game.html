<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Night Glide — Cánh chim đêm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #120C2E;
    --mint: #7EF0C8;
    --white: #FFFFFF;
    --outline: #1A1033;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--night);
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, transparent 2px 6px);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Press Start 2P", "Courier New", monospace;
  }
  #stage {
    position: relative;
    aspect-ratio: 2 / 3;
    height: min(calc(100vh - 24px), calc(150vw - 36px));
    max-height: 900px;
    box-shadow: 0 0 0 4px #0E0A1F, 0 0 0 8px #7EF0C8, 12px 12px 0 8px #0E0A1F;
    border-radius: 0;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; image-rendering: pixelated; image-rendering: crisp-edges; }
  #back {
    position: absolute; top: 2.5%; left: 3.5%;
    height: 6%; display: flex; align-items: center;
    padding: 0 3%;
    border: 3px solid #0E0A1F;
    box-shadow: inset 0 0 0 2px var(--mint);
    background: #22164A;
    color: var(--white); text-decoration: none;
    font-family: "Press Start 2P", "Courier New", monospace;
    font-size: clamp(7px, 1.2vh, 10px);
  }
  #mute {
    position: absolute; top: 2.5%; right: 3.5%;
    width: 9%; aspect-ratio: 1;
    border: 3px solid #0E0A1F;
    box-shadow: inset 0 0 0 2px var(--mint);
    background: #22164A;
    color: var(--white);
    font-family: "Press Start 2P", "Courier New", monospace;
    font-size: clamp(9px, 1.6vh, 14px);
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Night Glide game"></canvas>
  <a id="back" href="index.html" aria-label="Back">← Back</a>
  <button id="mute" type="button" aria-label="Toggle sound">♪</button>
</div>

<script>
(() => {
  'use strict';

  // ───────────────────────── Specs ─────────────────────────
  const W = 400, H = 600, FPS = 60, STEP = 1000 / FPS;
  const GROUND_H = 90;
  const GROUND_Y = H - GROUND_H;

  const BIRD_W = 60, BIRD_H = 45;
  const BIRD_X = 90;
  const GRAVITY = 0.5;
  const FLY_SPEED = -8;
  const MAX_FALL = 11;

  const COL_W = 72;          // column (pillar) width
  const GAP = 160;           // blank gap between upper and lower column
  const DISTANCE = 200;      // horizontal distance between consecutive columns
  const SPEED = 2;           // scroll speed (px per frame)
  const GAP_MIN_Y = 70;
  const GAP_MAX_Y = GROUND_Y - GAP - 50;

  const MILESTONE = 15;      // a reward every 15 points
  const MAGNET_FRAMES = 8 * FPS;

  const STATE = { READY: 'ready', PLAY: 'play', OVER: 'over', SHOP: 'shop' };

  // Shared UI colours (scene colours live in THEMES)
  const C = {
    coral: '#FF6B5B', cream: '#FFF1D6', outline: '#0E0A1F', lilac: '#C9BCFF',
    gem: '#4DF2D0', gemLight: '#E8FFF6', gemDark: '#1C9E8A',
    gold: '#FFC93D', goldLight: '#FFF0A8', goldDark: '#C98A12',
    shield: '#7FD8FF', magnet: '#FF4D5E',
  };

  // ───────────────────────── Scenes (one is picked for every new flight) ─────────────────────────
  const THEMES = [
    { id: 'night', name: 'STARRY NIGHT', vi: 'Đêm đầy sao',
      sky: ['#120B2B', '#1F1248', '#33196A', '#55247E', '#86357F'], stars: '#FFF1D6',
      cel: { type: 'moon', c: '#FFE3A8', d: '#E0B872', x: 112, y: 74, r: 10 },
      cloud: ['#6A3F94', '#4A2A78'], ridge: 'hills', far: ['#2A1856', '#4A2F86'], near: '#170E36',
      stone: ['#8C8FB8', '#C4C8E8', '#5A5C8A', '#6B6E9C'], cap: ['#3FD9A8', '#7EF0C8', '#1C8F78'],
      ground: ['#2A1A4F', '#33226A'], edge: ['#7EF0C8', '#3FD9A8', '#1C8F78'],
      weather: 'none', panel: '#22164A', text: '#C9BCFF' },
    { id: 'desert', name: 'DESERT DUSK', vi: 'Hoàng hôn sa mạc',
      sky: ['#2B1438', '#5C1F45', '#A33A4A', '#E0663F', '#F7A64A'], stars: '#FFD9B0',
      cel: { type: 'sun', c: '#FFE07A', d: '#F7A64A', x: 36, y: 128, r: 17 },
      cloud: ['#C8505A', '#8E2F4A'], ridge: 'dunes', far: ['#B5483F', '#D9674A'], near: '#6E2335',
      stone: ['#D9A066', '#F2CE8E', '#A86B3C', '#B87A48'], cap: ['#2EC4B6', '#8FF0E4', '#178A80'],
      ground: ['#C98A4B', '#B37840'], edge: ['#F2CE8E', '#D9A066', '#8C5A2E'],
      weather: 'dust', panel: '#4A1C3A', text: '#FFD3A8' },
    { id: 'snow', name: 'SNOWY NIGHT', vi: 'Đêm tuyết',
      sky: ['#07142B', '#0D2347', '#163A63', '#21557F', '#3B7699'], stars: '#E6F4FF',
      cel: { type: 'moon', c: '#EAF6FF', d: '#B8D4EA', x: 112, y: 70, r: 9 },
      cloud: ['#2E5A80', '#1F4466'], ridge: 'peaks', far: ['#1B3B5E', '#E6F4FF'], near: '#0E2440',
      stone: ['#9FD3E8', '#E2F6FF', '#5E9AB8', '#7DB8D2'], cap: ['#E6F4FF', '#FFFFFF', '#9DB8D2'],
      ground: ['#DCE9F6', '#C4D8EC'], edge: ['#FFFFFF', '#E6F0FA', '#9DB8D2'],
      weather: 'snow', panel: '#0F2A4A', text: '#BFE3FF' },
    { id: 'neon', name: 'NEON CITY', vi: 'Phố đêm neon',
      sky: ['#0A0614', '#160A2A', '#2A0E40', '#47115A', '#6E1466'], stars: null,
      cel: { type: 'crescent', c: '#FF9ED2', d: '#FF5FA2', x: 112, y: 74, r: 9 },
      cloud: ['#3A1450', '#26103A'], ridge: 'city', far: ['#2A1240', '#3D1A5C'], near: '#120820',
      windows: ['#FFE066', '#4DF2FF', '#FF5FA2'],
      stone: ['#5B5F7A', '#8A8FB0', '#3A3D52', '#4A4D66'], cap: ['#FF3FA4', '#FF9ED2', '#B0207A'],
      ground: ['#1A1028', '#24163A'], edge: ['#4DF2FF', '#1FB8D0', '#0E6A80'],
      weather: 'rain', panel: '#1A0C2E', text: '#FF9ED2' },
    { id: 'forest', name: 'FIREFLY FOREST', vi: 'Rừng đom đóm',
      sky: ['#06140F', '#0B231A', '#123527', '#1C4A35', '#2E6247'], stars: '#E8FFD6',
      cel: { type: 'crescent', c: '#F5F0C8', d: '#C8C08A', x: 112, y: 74, r: 9 },
      cloud: ['#24503C', '#173A2B'], ridge: 'pines', far: ['#143A2A', '#1F5039'], near: '#081A12',
      stone: ['#8A6A4A', '#B8936A', '#5C4430', '#6E5238'], cap: ['#7BC950', '#B8F08A', '#3E8A2C'],
      ground: ['#2A3A1E', '#334826'], edge: ['#9BE06A', '#5FAE3A', '#2E6A1E'],
      weather: 'fireflies', panel: '#10291D', text: '#CFF5B0' },
  ];

  // ───────────────────────── Rewards ─────────────────────────
  const MEDALS = [
    { name: 'BRONZE',   vi: 'Đồng',      c: '#D98A4A', d: '#8C4E22' },
    { name: 'SILVER',   vi: 'Bạc',       c: '#D8DEE8', d: '#8890A0' },
    { name: 'GOLD',     vi: 'Vàng',      c: '#FFC93D', d: '#C98A12' },
    { name: 'PLATINUM', vi: 'Bạch kim',  c: '#A8F0E8', d: '#4AA89E' },
    { name: 'DIAMOND',  vi: 'Kim cương', c: '#8AD8FF', d: '#3A86C8' },
    { name: 'LEGEND',   vi: 'Huyền thoại', c: '#FF7AD9', d: '#B0308E' },
  ];
  const medalFor = tier => tier > 0 ? MEDALS[Math.min(tier, MEDALS.length) - 1] : null;

  // Skins 1–4 unlock free at milestones (tier × 15) or can be bought; 5–7 are shop exclusives.
  const SKINS = [
    { name: 'CORAL',    R: '#FF6B5B', r: '#C8433D', L: '#FFA08F', price: 0 },
    { name: 'OCEAN',    R: '#4D9BE6', r: '#2F5FB0', L: '#9CD3FF', price: 60,  tier: 1 },
    { name: 'LIME',     R: '#7ED957', r: '#3E9C35', L: '#C2F59A', price: 120, tier: 2 },
    { name: 'ROYAL',    R: '#A66BFF', r: '#6B3FC8', L: '#D2B4FF', price: 200, tier: 3 },
    { name: 'GHOST',    R: '#E4E8FF', r: '#9AA2CC', L: '#FFFFFF', price: 400, tier: 4 },
    { name: 'CANDY',    R: '#FF8AC8', r: '#C8508E', L: '#FFC4E4', price: 150 },
    { name: 'MIDNIGHT', R: '#3A4A8C', r: '#232E5E', L: '#7A8CD8', price: 250 },
    { name: 'SUNSET',   R: '#FF8A3D', r: '#C8501E', L: '#FFC08A', price: 350 },
  ];
  const BOOSTS = {
    shield: { name: 'START SHIELD', vi: 'Khiên khởi đầu', price: 30 },
    magnet: { name: 'START MAGNET', vi: 'Nam châm khởi đầu', price: 40 },
  };
  const MAX_STOCK = 9;

  // ───────────────────────── Storage ─────────────────────────
  const store = {
    get(k, d) { try { const v = localStorage.getItem('night-glide-' + k); return v === null ? d : Number(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('night-glide-' + k, String(v)); } catch (e) { /* storage unavailable */ } },
  };
  let best = store.get('best', 0);
  let gemsTotal = store.get('gems', 0);
  // Owned skins as a bitmask (migrates the earlier "unlocked up to tier" value)
  let owned = store.get('owned', -1);
  if (owned < 0) owned = (1 << (Math.min(store.get('unlocked', 0), 4) + 1)) - 1;
  owned |= 1;
  const ownsSkin = i => (owned >> i) & 1;
  let skin = store.get('skin', 0);
  if (!SKINS[skin] || !ownsSkin(skin)) skin = 0;
  const stock = { shield: store.get('shieldStock', 0), magnet: store.get('magnetStock', 0) };
  const saveStock = () => { store.set('shieldStock', stock.shield); store.set('magnetStock', stock.magnet); };

  // ───────────────────────── Canvas ─────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ───────────────────────── Audio (synthesised) ─────────────────────────
  const Sound = (() => {
    let ac = null, muted = false;
    const ensure = () => {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ac = new AC();
      }
      if (ac && ac.state === 'suspended') ac.resume();
      return ac;
    };
    function tone({ type = 'sine', from, to, dur, vol = 0.2, delay = 0 }) {
      if (muted || !ensure()) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(from, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }
    function noise(dur, vol) {
      if (muted || !ensure()) return;
      const len = Math.floor(ac.sampleRate * dur);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 900;
      g.gain.value = vol;
      src.buffer = buf;
      src.connect(f).connect(g).connect(ac.destination);
      src.start();
    }
    return {
      unlock: ensure,
      wing:   () => tone({ type: 'triangle', from: 520, to: 880, dur: 0.09, vol: 0.12 }),
      point:  () => { tone({ from: 988, dur: 0.09, vol: 0.16 }); tone({ from: 1319, dur: 0.18, vol: 0.16, delay: 0.08 }); },
      gem:    n => tone({ type: 'square', from: 1046 + Math.min(n, 10) * 70, dur: 0.07, vol: 0.06 }),
      coin:   () => { tone({ type: 'square', from: 1319, dur: 0.06, vol: 0.07 }); tone({ type: 'square', from: 1760, dur: 0.14, vol: 0.07, delay: 0.06 }); },
      power:  () => [523, 659, 784, 1046].forEach((f, i) => tone({ type: 'triangle', from: f, dur: 0.1, vol: 0.12, delay: i * 0.06 })),
      fanfare:() => [523, 659, 784, 1046, 784, 1046, 1319].forEach((f, i) => tone({ type: 'square', from: f, dur: i === 6 ? 0.4 : 0.11, vol: 0.07, delay: i * 0.09 })),
      shield: () => { noise(0.12, 0.3); tone({ type: 'triangle', from: 880, to: 330, dur: 0.25, vol: 0.12 }); },
      skin:   () => tone({ type: 'square', from: 660, dur: 0.05, vol: 0.05 }),
      hit:    () => { noise(0.18, 0.5); tone({ type: 'square', from: 220, to: 70, dur: 0.25, vol: 0.12 }); },
      die:    () => tone({ type: 'sawtooth', from: 440, to: 110, dur: 0.5, vol: 0.08, delay: 0.22 }),
      toggle() { muted = !muted; return muted; },
    };
  })();

  // ───────────────────────── Helpers ─────────────────────────
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const hash = n => { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };

  // ───────────────────────── Pixel buffer ─────────────────────────
  // The world is painted on a low-resolution buffer (1 art pixel = 3 screen px)
  // and scaled up with nearest-neighbour sampling. UI text uses pixel fonts at full res.
  const P = 3;
  const LW = Math.ceil(W / P), LH = H / P;       // 134 × 200
  const LG = GROUND_Y / P;                        // ground line in art pixels (170)
  const L = v => Math.round(v / P);
  const buf = document.createElement('canvas');
  buf.width = LW; buf.height = LH;
  const b = buf.getContext('2d');
  b.imageSmoothingEnabled = false;
  const rect = (x, y, w, h, c) => { b.fillStyle = c; b.fillRect(x, y, w, h); };

  const FONT_HEAD = '"Press Start 2P", "Courier New", monospace';
  const FONT_BODY = '"VT323", "Courier New", monospace';
  if (document.fonts && document.fonts.load) {
    document.fonts.load('16px "Press Start 2P"').catch(() => {});
    document.fonts.load('20px "VT323"').catch(() => {});
  }

  // ───────────────────────── Sprites ─────────────────────────
  function sprite(rows, pal) {
    const h = rows.length, w = Math.max(...rows.map(r => r.length));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    rows.forEach((r, y) => [...r].forEach((ch, x) => {
      if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
    }));
    return c;
  }
  const BODY = [
    '.......KKKKKK.......',
    '.....KKLLLLRRKK.....',
    '....KLLRRRRRwwwK....',
    '...KLRRRRRRwwwwwK...',
    '..KRRRRRRRRwwKEwK...',
    '..KRRRRRRRRwwKEwK...',
    'KKRRRRRRRRRRwwwwKKK.',
    'KrKRRRRRRRRRRwwKYYYK',
    'KrrKRRRRRRRRRRKyyyyK',
    '.KrRRRRRRRRRRPKYYYK.',
    '..KrRRRRWWWWWRRKKK..',
    '..KrrRWWWWWWWWRK....',
    '...KrrWWWWWWWWK.....',
    '....KKrrrrrrKK......',
    '......KKKKKK........',
  ];
  const DEAD = BODY.map((r, i) => (i === 4 || i === 5) ? r.replace('KEwK', i === 4 ? 'KwKK' : 'KKwK') : r);
  const WINGS = [
    { x: 2, y: 1, rows: ['KK.......', 'KWK......', 'KWWKK....', 'KWWWWK...', '.KWWWWK..', '..KKKKK..'] },
    { x: 2, y: 6, rows: ['.KKKKK...', 'KWWWWWK..', 'KWWWWWWK.', '.KKKKKK..'] },
    { x: 2, y: 8, rows: ['.KKKKKK..', '.KWWWWWK.', '..KWWWWK.', '...KWWK..', '....KK...'] },
  ];
  function composeBird(bodyRows, wing, pal) {
    const c = document.createElement('canvas'); c.width = 20; c.height = 15;
    const g = c.getContext('2d');
    g.drawImage(sprite(bodyRows, pal), 0, 0);
    g.drawImage(sprite(wing.rows, pal), wing.x, wing.y);
    return c;
  }
  const SKIN_SPRITES = SKINS.map(s => {
    const pal = { K: C.outline, R: s.R, r: s.r, L: s.L, W: C.cream, E: C.outline, w: '#FFFFFF', Y: '#FFC23D', y: '#E09A1E', P: '#FF9EB5' };
    return { frames: WINGS.map(w => composeBird(BODY, w, pal)), dead: composeBird(DEAD, WINGS[1], pal) };
  });

  const GEM_IMG = sprite([
    '..KKK..',
    '.KLggK.',
    'KLLggdK',
    'KgggddK',
    '.KgddK.',
    '..KdK..',
    '...K...',
  ], { K: C.outline, L: C.gemLight, g: C.gem, d: C.gemDark });
  const MAGNET_IMG = sprite([
    'KKK.KKK',
    'KwK.KwK',
    'KRK.KRK',
    'KRKKKRK',
    'KRRRRRK',
    '.KRRRK.',
    '..KKK..',
  ], { K: C.outline, w: '#E8ECFF', R: C.magnet });

  // ───────────────────────── Scene state ─────────────────────────
  const RIDGE = 256;
  let T = THEMES[0], themeIndex = -1;
  let FAR = [], NEAR = [], NEAR_ID = [], NEAR_START = [];
  let stars = [], weather = [];
  const clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * 110 + rand(0, 60), y: rand(40, 200), s: rand(0.6, 1.2) }));
  let bgOffset = 0, hillOffset = 0, nearOffset = 0, groundOffset = 0;

  const wave = (amp, base, k1, k2, ph) => Array.from({ length: RIDGE }, (_, x) =>
    Math.round(base + Math.sin(2 * Math.PI * k1 * x / RIDGE + ph) * amp + Math.sin(2 * Math.PI * k2 * x / RIDGE + ph * 2) * amp * 0.35));

  function blocks(minW, maxW, minH, maxH) {   // skyline of rectangular blocks
    const h = new Array(RIDGE), id = new Array(RIDGE), start = new Array(RIDGE);
    let x = 0, n = 0;
    while (x < RIDGE) {
      const w = Math.min(Math.floor(rand(minW, maxW)), RIDGE - x), hh = Math.floor(rand(minH, maxH));
      for (let i = 0; i < w; i++) { h[x + i] = hh; id[x + i] = n; start[x + i] = x; }
      x += w; n++;
    }
    return { h, id, start };
  }

  function spikes(spacingMin, spacingMax, hMin, hMax, slope, base) {  // peaks / pine tops (seamless)
    const h = new Array(RIDGE).fill(base);
    const tops = [];
    for (let x = 0; x < RIDGE; x += Math.floor(rand(spacingMin, spacingMax))) tops.push({ x, h: rand(hMin, hMax) });
    for (let x = 0; x < RIDGE; x++) {
      for (const t of tops) {
        for (const shift of [-RIDGE, 0, RIDGE]) {
          const v = t.h - Math.abs(x - (t.x + shift)) * slope;
          if (v > h[x]) h[x] = v;
        }
      }
      h[x] = Math.round(h[x]);
    }
    return h;
  }

  function pickTheme() {
    let i;
    do { i = Math.floor(Math.random() * THEMES.length); } while (i === themeIndex && THEMES.length > 1);
    themeIndex = i; T = THEMES[i];
    const ph = rand(0, Math.PI * 2);
    NEAR_ID = []; NEAR_START = [];
    switch (T.ridge) {
      case 'dunes': FAR = wave(9, 30, 2, 5, ph); NEAR = wave(7, 13, 3, 7, ph + 1); break;
      case 'peaks': FAR = spikes(18, 34, 34, 62, 1.6, 18); NEAR = wave(4, 12, 4, 13, ph); break;
      case 'city': {
        FAR = blocks(5, 12, 26, 58).h;
        const nb = blocks(8, 17, 12, 34); NEAR = nb.h; NEAR_ID = nb.id; NEAR_START = nb.start; break;
      }
      case 'pines': FAR = wave(6, 26, 3, 9, ph); NEAR = spikes(5, 9, 14, 30, 2.4, 6); break;
      default: FAR = wave(9, 36, 3, 11, ph); NEAR = wave(5, 15, 5, 17, ph + 1.3);
    }
    stars = T.stars ? Array.from({ length: 34 }, () => ({ x: Math.floor(rand(0, LW)), y: Math.floor(rand(4, 100)), p: Math.floor(rand(0, 120)), big: Math.random() < 0.2 })) : [];
    weather = T.weather === 'none' ? [] : Array.from({ length: T.weather === 'rain' ? 46 : 36 }, () => ({ x: rand(0, LW), y: rand(0, LG), v: rand(0, 1), p: rand(0, 100) }));
  }

  // ───────────────────────── Game objects ─────────────────────────
  const bird = { x: BIRD_X, y: 0, vy: 0, rot: 0, flapTimer: 0, frame: 0, t: 0 };
  let columns = [], items = [], particles = [];
  let state = STATE.READY;
  let score = 0, isNewBest = false, overTimer = 0, flash = 0, scorePulse = 0;
  let gemsRun = 0, combo = 0, comboTimer = 0, tierRun = 0;
  let shield = false, invuln = 0, magnet = 0;
  let banner = null;       // milestone banner { tier, t, newSkin, bonus }
  let toast = null;        // small pickup message { text, t, c }

  function reset() {
    bird.y = H * 0.42; bird.vy = 0; bird.rot = 0; bird.flapTimer = 0; bird.t = 0;
    columns = []; items = []; particles = [];
    score = 0; isNewBest = false; overTimer = 0; flash = 0; scorePulse = 0;
    gemsRun = 0; combo = 0; comboTimer = 0; tierRun = 0;
    shield = false; invuln = 0; magnet = 0; banner = null; toast = null;
    state = STATE.READY;
    pickTheme();
  }

  function spawnColumn(x) {
    const gapY = Math.round(rand(GAP_MIN_Y, GAP_MAX_Y));
    const gc = gapY + GAP / 2;
    const prev = columns[columns.length - 1];
    columns.push({ x, gapY, passed: false });

    // In the gap: a gem or (rarely) a star coin
    const r = Math.random();
    if (r < 0.1) items.push({ x: x + COL_W / 2, y: gc, type: 'coin', t: 0 });
    else if (r < 0.65) items.push({ x: x + COL_W / 2, y: gc + rand(-20, 20), type: 'gem', t: 0 });

    // Between columns: an arc of gems, sometimes with a power-up at its crest
    if (prev && Math.random() < 0.7) {
      const midX = x - DISTANCE / 2;
      const midY = clamp((prev.gapY + GAP / 2 + gc) / 2, 60, GROUND_Y - 60);
      const powerChance = score >= 2 ? 0.14 : 0;
      [-28, 0, 28].forEach((dx, i) => {
        const y = midY - (i === 1 ? 14 : 0);
        if (i === 1 && Math.random() < powerChance) {
          items.push({ x: midX + dx, y, type: Math.random() < 0.5 ? 'shield' : 'magnet', t: 0 });
        } else {
          items.push({ x: midX + dx, y, type: 'gem', t: i * 8 });
        }
      });
    }
  }

  function burst(x, y, colors, n, speed = 2, gravity = 0, life = 28) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = rand(0.4, 1) * speed;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: gravity, life, max: life, c: colors[i % colors.length], big: Math.random() < 0.3 });
    }
  }

  function flap() {
    bird.vy = FLY_SPEED;
    bird.flapTimer = 14;
    Sound.wing();
    for (let i = 0; i < 4; i++) {
      particles.push({ x: bird.x - 18, y: bird.y + rand(-6, 10), vx: rand(-2.2, -0.8), vy: rand(-0.6, 0.8), g: 0, life: 26, max: 26, c: C.cream });
    }
  }

  function collect(it) {
    it.taken = true;
    switch (it.type) {
      case 'gem':
        combo = comboTimer > 0 ? combo + 1 : 0; comboTimer = 50;
        gemsRun += 1; Sound.gem(combo);
        burst(it.x, it.y, [C.gem, C.gemLight], 6, 1.6);
        break;
      case 'coin':
        gemsRun += 5; Sound.coin();
        burst(it.x, it.y, [C.gold, C.goldLight], 10, 2);
        toast = { text: '+5', t: 50, c: C.gold, x: it.x, y: it.y };
        break;
      case 'shield':
        if (shield) { gemsRun += 5; toast = { text: '+5', t: 50, c: C.gold, x: it.x, y: it.y }; }
        else { shield = true; toast = { text: 'SHIELD', t: 60, c: C.shield, x: it.x, y: it.y }; }
        Sound.power(); burst(it.x, it.y, [C.shield, '#FFFFFF'], 12, 2.2);
        break;
      case 'magnet':
        magnet = MAGNET_FRAMES; Sound.power();
        toast = { text: 'MAGNET', t: 60, c: C.magnet, x: it.x, y: it.y };
        burst(it.x, it.y, [C.magnet, '#FFFFFF'], 12, 2.2);
        break;
    }
  }

  function milestone(tier) {
    tierRun = tier;
    const bonus = 10 * tier;
    gemsRun += bonus;
    shield = true;
    let newSkin = null;
    const unlock = SKINS.findIndex(sk => sk.tier === tier);
    if (unlock > 0 && !ownsSkin(unlock)) {
      owned |= 1 << unlock; store.set('owned', owned);
      newSkin = SKINS[unlock].name;
    }
    banner = { tier, t: 170, newSkin, bonus };
    const m = medalFor(tier);
    for (let i = 0; i < 3; i++) burst(rand(80, 320), rand(90, 220), [m.c, C.cream, C.gem, C.coral], 18, 3, 0.08, 50);
    Sound.fanfare();
  }

  // Shield absorbs a hit; returns true if the bird survives.
  function absorb(kind) {
    if (!shield) return false;
    shield = false; invuln = 70; flash = 0.5;
    Sound.shield();
    burst(bird.x, bird.y, [C.shield, '#FFFFFF'], 16, 3);
    if (kind === 'ground') bird.vy = FLY_SPEED;
    if (kind === 'ceiling') bird.vy = 2;
    return true;
  }

  function gameOver() {
    if (state === STATE.OVER) return;
    state = STATE.OVER;
    flash = 1;
    Sound.hit(); Sound.die();
    if (score > best) { best = score; isNewBest = true; store.set('best', best); }
    gemsTotal += gemsRun; store.set('gems', gemsTotal);
  }

  // ───────────────────────── Input ─────────────────────────
  const SKIN_Y = 306;
  const arrowHit = (x, y) => {
    if (y < SKIN_Y - 26 || y > SKIN_Y + 26) return 0;
    if (x > 70 && x < 140) return -1;
    if (x > 260 && x < 330) return 1;
    return 0;
  };
  const ownedList = () => SKINS.map((_, i) => i).filter(ownsSkin);
  function changeSkin(dir) {
    const list = ownedList();
    if (list.length < 2) return false;
    const k = list.indexOf(skin);
    skin = list[(k + dir + list.length) % list.length];
    store.set('skin', skin);
    Sound.skin();
    return true;
  }

  // ── Shop ──
  const SHOP_ROWS = [
    ...SKINS.map((sk, i) => ({ kind: 'skin', i })).slice(1),
    { kind: 'shield' }, { kind: 'magnet' },
  ];
  const SHOP_Y0 = 112, ROW_H = 42;
  const SHOP_BACK = { x: 110, y: 508, w: 180, h: 42 };
  const READY_SHOP = { x: 130, y: 466, w: 140, h: 40 };
  const OVER_SHOP = { x: 130, y: 415, w: 140, h: 40 };
  let shopSel = 0, shopMsg = null;
  const inRect = (x, y, r) => x !== undefined && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

  function openShop() {
    if (state === STATE.OVER) reset();
    state = STATE.SHOP; shopMsg = null;
    Sound.skin();
  }
  function closeShop() { state = STATE.READY; Sound.skin(); }

  function rowStatus(row) {
    if (row.kind === 'skin') {
      if (!ownsSkin(row.i)) return { label: String(SKINS[row.i].price), price: SKINS[row.i].price };
      return { label: skin === row.i ? 'IN USE' : 'EQUIP', price: 0, owned: true };
    }
    const full = stock[row.kind] >= MAX_STOCK;
    return { label: full ? 'FULL' : String(BOOSTS[row.kind].price), price: BOOSTS[row.kind].price, full };
  }

  function buy(idx) {
    const row = SHOP_ROWS[idx]; if (!row) return;
    shopSel = idx;
    const st = rowStatus(row);
    const say = (text, c) => { shopMsg = { text, t: 90, c, row: idx }; };
    if (row.kind === 'skin' && st.owned) {
      skin = row.i; store.set('skin', skin); Sound.skin();
      say('EQUIPPED · ĐÃ CHỌN', C.cream);
      return;
    }
    if (st.full) { say('STOCK FULL · ĐÃ ĐẦY', T.text); return; }
    if (gemsTotal < st.price) { say(`NEED ${st.price - gemsTotal} MORE GEMS`, C.coral); Sound.hit(); return; }
    gemsTotal -= st.price; store.set('gems', gemsTotal);
    if (row.kind === 'skin') {
      owned |= 1 << row.i; store.set('owned', owned);
      skin = row.i; store.set('skin', skin);
    } else {
      stock[row.kind]++; saveStock();
    }
    Sound.coin(); Sound.power();
    burst(330, SHOP_Y0 + idx * ROW_H + 20, [C.gem, C.gold, C.cream], 16, 2.4);
    say('PURCHASED! · ĐÃ MUA', C.gem);
  }

  function shopTap(x, y) {
    if (inRect(x, y, SHOP_BACK)) { closeShop(); return; }
    const idx = Math.floor((y - SHOP_Y0) / ROW_H);
    if (x >= 20 && x <= 380 && idx >= 0 && idx < SHOP_ROWS.length) buy(idx);
  }

  function startFlight() {
    state = STATE.PLAY;
    if (stock.shield > 0) { stock.shield--; shield = true; }
    if (stock.magnet > 0) { stock.magnet--; magnet = MAGNET_FRAMES; }
    saveStock();
    spawnColumn(W + 40);
    flap();
  }

  const overReady = () => overTimer > 35 && bird.y + BIRD_H / 2 >= GROUND_Y - 1;

  function press(x, y) {
    Sound.unlock();
    if (state === STATE.SHOP) {
      if (x !== undefined) shopTap(x, y); else buy(shopSel);
    } else if (state === STATE.READY) {
      if (inRect(x, y, READY_SHOP)) { openShop(); return; }
      if (x !== undefined) { const d = arrowHit(x, y); if (d && changeSkin(d)) return; }
      startFlight();
    } else if (state === STATE.PLAY) {
      flap();
    } else if (state === STATE.OVER && overReady()) {
      if (inRect(x, y, OVER_SHOP)) openShop(); else reset();
    }
  }
  window.addEventListener('keydown', e => {
    if (state === STATE.SHOP) {
      if (e.code === 'ArrowDown' || e.code === 'ArrowUp') {
        e.preventDefault();
        shopSel = (shopSel + (e.code === 'ArrowDown' ? 1 : -1) + SHOP_ROWS.length) % SHOP_ROWS.length;
      } else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) buy(shopSel); }
      else if (e.code === 'Escape' || e.code === 'Backspace' || e.code === 'KeyS') { e.preventDefault(); closeShop(); }
      return;
    }
    if (e.code === 'KeyS' && (state === STATE.READY || (state === STATE.OVER && overReady()))) { e.preventDefault(); openShop(); return; }
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) press();
    } else if (state === STATE.READY && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
      e.preventDefault();
      changeSkin(e.code === 'ArrowLeft' ? -1 : 1);
    }
  });
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    press((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
  });
  const muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
  const backBtn = document.getElementById('back');
  if (backBtn) backBtn.addEventListener('pointerdown', e => e.stopPropagation());
  muteBtn.addEventListener('click', () => {
    const m = Sound.toggle();
    muteBtn.textContent = m ? 'X' : '♪';
    muteBtn.blur();
  });

  // ───────────────────────── Collision ─────────────────────────
  function birdBox() {
    const insetX = 9, insetY = 8;
    return { l: bird.x - BIRD_W / 2 + insetX, r: bird.x + BIRD_W / 2 - insetX, t: bird.y - BIRD_H / 2 + insetY, b: bird.y + BIRD_H / 2 - insetY };
  }
  function hitsColumn(c, bx) {
    if (bx.r <= c.x || bx.l >= c.x + COL_W) return false;
    return bx.t < c.gapY || bx.b > c.gapY + GAP;
  }

  // ───────────────────────── Update (fixed 60 FPS step) ─────────────────────────
  function updateWeather() {
    for (const w of weather) {
      switch (T.weather) {
        case 'snow': w.y += 0.18 + w.v * 0.25; w.x += Math.sin((bird.t + w.p * 10) / 40) * 0.12 - 0.12; break;
        case 'rain': w.y += 2.6 + w.v; w.x -= 0.9; break;
        case 'dust': w.x -= 0.9 + w.v * 1.2; w.y += Math.sin((bird.t + w.p * 10) / 30) * 0.08; break;
        case 'fireflies': w.x += Math.sin((bird.t + w.p * 13) / 55) * 0.18 - 0.08; w.y += Math.cos((bird.t + w.p * 7) / 45) * 0.12; break;
      }
      if (w.y > LG) { w.y = -3; w.x = rand(0, LW + 20); }
      if (w.x < -4) { w.x = LW + 2; if (T.weather !== 'fireflies') w.y = rand(0, LG); }
      if (T.weather === 'fireflies') w.y = clamp(w.y, 60, LG - 4);
    }
  }

  function update() {
    bird.t++;
    if (bird.flapTimer > 0) bird.flapTimer--;
    bird.frame = bird.flapTimer > 0 ? Math.floor(bird.t / 3) % 3 : 1;
    updateWeather();

    if (state !== STATE.OVER) {
      bgOffset = (bgOffset + SPEED * 0.15) % (LW * P);
      hillOffset = (hillOffset + SPEED * 0.35) % (RIDGE * P);
      nearOffset = (nearOffset + SPEED * 0.6) % (RIDGE * P);
      groundOffset = (groundOffset + SPEED) % 24;
      for (const c of clouds) { c.x -= SPEED * 0.15 * c.s; if (c.x < -90) { c.x = W + rand(10, 80); c.y = rand(40, 200); } }
    }

    if (state === STATE.READY || state === STATE.SHOP) {
      bird.y = H * 0.42 + Math.sin(bird.t / 12) * 7;
      bird.rot = 0;
      if (bird.t % 30 === 0) bird.flapTimer = 12;
    } else if (state === STATE.PLAY) {
      bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
      bird.y += bird.vy;
      bird.rot = Math.max(-0.45, Math.min(1.35, bird.vy * 0.09));
      if (invuln > 0) invuln--;
      if (magnet > 0) magnet--;
      if (comboTimer > 0) comboTimer--;

      // Columns
      for (const c of columns) c.x -= SPEED;
      const last = columns[columns.length - 1];
      if (last && last.x <= W + 40 - (COL_W + DISTANCE)) spawnColumn(last.x + COL_W + DISTANCE);
      columns = columns.filter(c => c.x + COL_W > -10);

      // Collectibles
      for (const it of items) {
        it.x -= SPEED; it.t++;
        if (magnet > 0 && (it.type === 'gem' || it.type === 'coin')) {
          const dx = bird.x - it.x, dy = bird.y - it.y, d = Math.hypot(dx, dy);
          if (d < 170) { it.x += dx / d * 6; it.y += dy / d * 6; }
        }
        const dy = it.y + Math.sin(it.t / 12) * 3 - bird.y;
        if (!it.taken && Math.hypot(it.x - bird.x, dy) < 27) collect(it);
      }
      items = items.filter(it => !it.taken && it.x > -20);

      // Scoring
      for (const c of columns) {
        if (!c.passed && bird.x > c.x + COL_W) {
          c.passed = true; score++; scorePulse = 1; Sound.point();
          if (score % MILESTONE === 0) milestone(score / MILESTONE);
        }
      }

      // Collisions
      const bx = birdBox();
      if (bx.t <= 0) { if (!absorb('ceiling')) { bird.y = BIRD_H / 2 - 8; gameOver(); } else bird.y = BIRD_H / 2 - 6; }
      else if (bx.b >= GROUND_Y) { if (!absorb('ground')) { bird.y = GROUND_Y - BIRD_H / 2 + 8; gameOver(); } else bird.y = GROUND_Y - BIRD_H / 2 + 6; }
      else if (invuln === 0 && columns.some(c => hitsColumn(c, bx))) { if (!absorb('column')) gameOver(); }
    } else if (state === STATE.OVER) {
      overTimer++;
      if (bird.y + BIRD_H / 2 < GROUND_Y) {
        bird.vy = Math.min(bird.vy + GRAVITY * 1.4, MAX_FALL * 1.3);
        bird.y = Math.min(bird.y + bird.vy, GROUND_Y - BIRD_H / 2);
        bird.rot = Math.min(bird.rot + 0.12, Math.PI / 2);
      } else {
        bird.rot = Math.PI / 2;
      }
    }

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += p.g || 0; p.life--; }
    particles = particles.filter(p => p.life > 0);
    if (banner && --banner.t <= 0) banner = null;
    if (shopMsg && --shopMsg.t <= 0) shopMsg = null;
    if (toast && --toast.t <= 0) toast = null;
    if (flash > 0) flash = Math.max(0, flash - 0.06);
    if (scorePulse > 0) scorePulse = Math.max(0, scorePulse - 0.07);
  }

  // ───────────────────────── Drawing: world (low-res buffer) ─────────────────────────
  function disc(cx, cy, r, c) {
    for (let dy = -r; dy <= r; dy++) {
      const half = Math.floor(Math.sqrt(r * r - dy * dy));
      rect(cx - half, cy + dy, half * 2 + 1, 1, c);
    }
  }

  function drawSky() {
    const bands = [46, 40, 34, 28, 22];
    let y = 0;
    T.sky.forEach((col, i) => {
      rect(0, y, LW, bands[i], col);
      const next = T.sky[i + 1];
      if (next) {
        b.fillStyle = next;
        for (let x = 0; x < LW; x++) b.fillRect(x, y + bands[i] - 2 + (x & 1), 1, 1);
      }
      y += bands[i];
    });
    rect(0, y, LW, LG - y, T.sky[4]);

    for (const s of stars) {
      const sx = ((s.x - Math.floor(bgOffset / P)) % LW + LW) % LW;
      if ((bird.t + s.p) % 120 < 100) {
        rect(sx, s.y, 1, 1, T.stars);
        if (s.big && (bird.t + s.p) % 60 < 30) { rect(sx - 1, s.y, 3, 1, T.stars); rect(sx, s.y - 1, 1, 3, T.stars); }
      }
    }

    const cel = T.cel, mx = cel.x - Math.floor(bgOffset / P / 5), my = cel.y, r = cel.r;
    b.fillStyle = cel.type === 'sun' ? 'rgba(255,224,122,0.22)' : 'rgba(255,240,210,0.15)';
    for (let dy = -r - 3; dy <= r + 3; dy++) {
      const half = Math.floor(Math.sqrt((r + 3) ** 2 - dy * dy));
      b.fillRect(mx - half, my + dy, half * 2 + 1, 1);
    }
    if (cel.type === 'crescent') {
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy <= r * r && (dx - 4) ** 2 + (dy + 2) ** 2 > (r - 1) ** 2) rect(mx + dx, my + dy, 1, 1, cel.c);
      }
    } else {
      disc(mx, my, r, cel.c);
      if (cel.type === 'moon') {
        rect(mx - 4, my - 4, 3, 2, cel.d); rect(mx + 3, my + 2, 2, 2, cel.d); rect(mx - 2, my + 5, 2, 1, cel.d);
      } else {   // retro sun: stripes cut through the lower half
        for (let k = 0; k < 4; k++) rect(mx - r, my + 3 + k * 4, r * 2 + 1, 1 + (k >> 1), T.sky[4]);
        rect(mx - r + 4, my - r + 4, 3, 2, '#FFF6C8');
      }
    }

    for (const c of clouds) {
      const cx = Math.round(c.x / P), cy = Math.round(c.y / P) + 10, s = c.s > 0.9 ? 2 : 1;
      rect(cx - 6 * s, cy, 14 * s, 3, T.cloud[0]);
      rect(cx - 3 * s, cy - 2, 8 * s, 2, T.cloud[0]);
      rect(cx - 6 * s, cy + 3, 14 * s, 1, T.cloud[1]);
    }
  }

  function drawRidges() {
    const fo = Math.floor(hillOffset / P), no = Math.floor(nearOffset / P);
    for (let x = 0; x < LW; x++) {
      const fi = (x + fo) % RIDGE, hf = FAR[fi];
      rect(x, LG - hf, 1, hf, T.far[0]);
      if (T.ridge === 'peaks') { if (hf > 40) rect(x, LG - hf, 1, Math.min(4, hf - 40), T.far[1]); }
      else if (T.ridge === 'city') { if (FAR[fi] !== FAR[(fi + 1) % RIDGE]) rect(x, LG - hf, 1, hf, T.far[1]); }
      else rect(x, LG - hf, 1, 1, T.far[1]);
    }
    for (let x = 0; x < LW; x++) {
      const ni = (x + no) % RIDGE, hn = NEAR[ni];
      rect(x, LG - hn, 1, hn, T.near);
      if (T.ridge === 'city') {     // lit windows, stable per building
        const id = NEAR_ID[ni], lx = ni - NEAR_START[ni];
        if (lx % 3 === 1) {
          for (let wy = LG - hn + 3; wy < LG - 3; wy += 4) {
            if (hash(id * 31 + lx * 7 + wy) < 0.42) rect(x, wy, 1, 2, T.windows[id % 3]);
          }
        }
      }
    }
  }

  function drawWeather() {
    for (const w of weather) {
      const x = Math.round(w.x), y = Math.round(w.y);
      switch (T.weather) {
        case 'snow': rect(x, y, w.v > 0.7 ? 2 : 1, w.v > 0.7 ? 2 : 1, '#FFFFFF'); break;
        case 'rain': rect(x, y, 1, 3, 'rgba(127,216,255,0.55)'); break;
        case 'dust': rect(x, y, 1, 1, 'rgba(255,211,160,0.6)'); break;
        case 'fireflies':
          if ((bird.t + Math.floor(w.p * 7)) % 90 < 55) { rect(x, y, 1, 1, '#E8FF7A'); b.fillStyle = 'rgba(232,255,122,0.25)'; b.fillRect(x - 1, y - 1, 3, 3); }
          break;
      }
    }
  }

  function drawPillar(x, top, bottom, capAtBottom) {
    const w = COL_W / P;
    if (bottom <= top) return;
    const [stone, light, dark, mortar] = T.stone;
    rect(x, top, w, bottom - top, stone);
    rect(x + 2, top, 3, bottom - top, light);
    rect(x + w - 4, top, 3, bottom - top, dark);
    const anchor = capAtBottom ? bottom : top;
    for (let y = top; y < bottom; y++) {
      const d = y - anchor, ry = ((d % 6) + 6) % 6, course = Math.floor(d / 6);
      if (ry === 0) rect(x + 1, y, w - 2, 1, mortar);
      else if (course & 1) rect(x + 12, y, 1, 1, mortar);
      else { rect(x + 6, y, 1, 1, mortar); rect(x + 18, y, 1, 1, mortar); }
    }
    rect(x, top, 1, bottom - top, C.outline);
    rect(x + w - 1, top, 1, bottom - top, C.outline);

    const cw = w + 4, ch = 6, cx = x - 2, cy = capAtBottom ? bottom - ch : top;
    const [cap, capL, capD] = T.cap;
    rect(cx, cy, cw, ch, C.outline);
    rect(cx + 1, cy + 1, cw - 2, ch - 2, cap);
    rect(cx + 2, cy + 1, cw - 8, 1, capL);
    rect(cx + cw - 4, cy + 1, 2, ch - 2, capD);
    for (let gx = cx + 4; gx < cx + cw - 4; gx += 6) rect(gx, cy + 3, 2, 1, capL);
  }

  function drawColumns() {
    for (const c of columns) {
      const x = Math.round(c.x / P);
      drawPillar(x, -2, L(c.gapY), true);
      drawPillar(x, L(c.gapY + GAP), LG, false);
    }
  }

  function drawGround() {
    const off = Math.floor(groundOffset / P) % 8;
    rect(0, LG, LW, LH - LG, T.ground[0]);
    rect(0, LG, LW, 1, C.outline);
    rect(0, LG + 1, LW, 2, T.edge[0]);
    for (let x = -off; x < LW + 8; x += 8) { rect(x + 1, LG + 3, 2, 1, T.edge[1]); rect(x + 5, LG + 3, 1, 2, T.edge[2]); }
    rect(0, LG + 5, LW, 1, C.outline);
    for (let row = 0; row < 3; row++) {
      for (let x = -off - (row & 1 ? 4 : 0); x < LW + 8; x += 8) rect(x, LG + 7 + row * 8, 4, 4, T.ground[1]);
    }
  }

  function drawItems() {
    for (const it of items) {
      const x = Math.round(it.x / P), y = Math.round((it.y + Math.sin(it.t / 12) * 3) / P);
      switch (it.type) {
        case 'gem': {
          b.drawImage(GEM_IMG, x - 3, y - 3);
          if ((it.t >> 3) % 6 === 0) rect(x - 1, y - 2, 1, 1, '#FFFFFF');
          break;
        }
        case 'coin': {   // spinning star coin
          const wds = [7, 5, 3, 5], wd = wds[(it.t >> 3) % 4];
          rect(x - (wd >> 1), y - 4, wd, 9, C.outline);
          rect(x - (wd >> 1), y - 3, wd, 7, C.outline);
          rect(x - (wd >> 1) + (wd > 3 ? 1 : 0), y - 3, Math.max(1, wd - 2), 7, C.gold);
          if (wd > 3) { rect(x, y - 2, 1, 5, C.goldLight); rect(x - 1, y, 3, 1, C.goldLight); }
          if (wd === 7) rect(x + 2, y - 2, 1, 4, C.goldDark);
          break;
        }
        case 'shield': {
          const pulse = (it.t >> 4) % 2;
          b.fillStyle = 'rgba(127,216,255,0.25)';
          for (let dy = -6; dy <= 6; dy++) { const h = Math.floor(Math.sqrt(36 - dy * dy)); b.fillRect(x - h, y + dy, h * 2 + 1, 1); }
          for (let a = 0; a < 32; a++) { const t = a / 32 * Math.PI * 2; rect(Math.round(x + Math.cos(t) * (6 + pulse)), Math.round(y + Math.sin(t) * (6 + pulse)), 1, 1, C.shield); }
          rect(x - 2, y - 3, 5, 4, '#FFFFFF'); rect(x - 1, y + 1, 3, 1, '#FFFFFF'); rect(x, y + 2, 1, 1, '#FFFFFF');
          rect(x - 1, y - 2, 3, 2, C.shield);
          break;
        }
        case 'magnet': {
          b.fillStyle = 'rgba(255,77,94,0.22)';
          for (let dy = -6; dy <= 6; dy++) { const h = Math.floor(Math.sqrt(36 - dy * dy)); b.fillRect(x - h, y + dy, h * 2 + 1, 1); }
          b.drawImage(MAGNET_IMG, x - 3, y - 3);
          break;
        }
      }
    }
  }

  function drawBird() {
    const set = SKIN_SPRITES[skin];
    const img = state === STATE.OVER ? set.dead : set.frames[bird.frame];
    const cx = Math.round(bird.x / P), cy = Math.round(bird.y / P);
    const blinkOut = invuln > 0 && (invuln >> 2) % 2 === 0;
    if (!blinkOut) {
      const rot = Math.round(bird.rot / (Math.PI / 8)) * (Math.PI / 8);
      b.save(); b.translate(cx, cy); b.rotate(rot); b.drawImage(img, -10, -8); b.restore();
    }
    if (shield && state === STATE.PLAY) {
      const rr = 13 + ((bird.t >> 4) % 2);
      for (let a = 0; a < 56; a++) {
        if ((a + (bird.t >> 2)) % 7 === 0) continue;
        const t = a / 56 * Math.PI * 2;
        rect(Math.round(cx + Math.cos(t) * rr), Math.round(cy + Math.sin(t) * (rr - 2)), 1, 1, C.shield);
      }
    }
    if (magnet > 0 && state === STATE.PLAY && (bird.t >> 3) % 2) {
      rect(cx - 15, cy - 1, 2, 1, C.magnet); rect(cx + 14, cy - 1, 2, 1, C.magnet);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      if (p.life / p.max < 0.3 && p.life % 2) continue;
      const s = p.big ? 2 : 1;
      rect(Math.round(p.x / P), Math.round(p.y / P), s, s, p.c || C.cream);
    }
  }

  // ───────────────────────── Drawing: UI (full res) ─────────────────────────
  const snap = v => Math.round(v / P) * P;
  function text(str, x, y, { size = 16, color = C.cream, align = 'center', font = FONT_HEAD, shadow = C.outline, alpha = 1 } = {}) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `${size}px ${font}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, snap(x) + P, snap(y) + P); }
    ctx.fillStyle = color;
    ctx.fillText(str, snap(x), snap(y));
    ctx.restore();
  }
  function pixelBox(x, y, w, h, fill, border, shadow = true) {
    x = snap(x); y = snap(y); w = snap(w); h = snap(h);
    if (shadow) { ctx.fillStyle = 'rgba(14,10,31,0.6)'; ctx.fillRect(x + P * 2, y + P * 2, w, h); }
    ctx.fillStyle = border;
    ctx.fillRect(x + P, y, w - 2 * P, h);
    ctx.fillRect(x, y + P, w, h - 2 * P);
    ctx.fillStyle = fill;
    ctx.fillRect(x + 2 * P, y + P, w - 4 * P, h - 2 * P);
    ctx.fillRect(x + P, y + 2 * P, w - 2 * P, h - 4 * P);
  }
  function icon(img, x, y, scale = P) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, snap(x), snap(y), img.width * scale, img.height * scale);
  }
  function arrow(x, y, dir, color) {
    ctx.fillStyle = color;
    for (let i = 0; i < 5; i++) {
      const h = (5 - i) * 2 - 1;
      const cx = dir < 0 ? x - i * P : x + i * P;
      ctx.fillRect(snap(cx), snap(y - (h * P) / 2), P, h * P);
    }
  }
  function medalIcon(m, x, y) {
    const s = P, X = snap(x), Y = snap(y);
    ctx.fillStyle = C.coral; ctx.fillRect(X - 2 * s, Y - 6 * s, 2 * s, 4 * s);
    ctx.fillStyle = '#4D9BE6'; ctx.fillRect(X, Y - 6 * s, 2 * s, 4 * s);
    const rows = [[-1, 2], [-2, 4], [-3, 6], [-3, 6], [-3, 6], [-2, 4], [-1, 2]];
    rows.forEach(([o, w], i) => { ctx.fillStyle = C.outline; ctx.fillRect(X + (o - 1) * s, Y + (i - 2) * s, (w + 2) * s, s); });
    rows.forEach(([o, w], i) => { if (i > 0 && i < 6) { ctx.fillStyle = m.c; ctx.fillRect(X + o * s, Y + (i - 2) * s, w * s, s); } });
    ctx.fillStyle = m.d; ctx.fillRect(X + s, Y, s, 2 * s);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(X - 2 * s, Y - s, s, s);
  }

  function drawHUD() {
    text(String(score), W / 2, 66 + (scorePulse > 0.5 ? -P : 0), { size: 36, color: C.cream });
    // Gems this flight (below the Back button)
    icon(GEM_IMG, 15, 72);
    text(String(gemsRun), 42, 84, { size: 12, align: 'left' });
    // Active power-ups (below the sound button)
    let px = 366;
    if (magnet > 0) {
      icon(MAGNET_IMG, px - 6, 72);
      const wbar = Math.ceil(magnet / MAGNET_FRAMES * 7) * P;
      ctx.fillStyle = C.outline; ctx.fillRect(px - 9, 99, 27, 6);
      ctx.fillStyle = C.magnet; ctx.fillRect(px - 9, 99, wbar, 6);
      px -= 33;
    }
    if (shield) {
      ctx.fillStyle = C.outline; ctx.fillRect(snap(px - 6), 72, 21, 24);
      ctx.fillStyle = C.shield; ctx.fillRect(snap(px - 3), 75, 15, 12);
      ctx.fillRect(snap(px), 87, 9, 3); ctx.fillRect(snap(px + 3), 90, 3, 3);
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(snap(px), 78, 3, 6);
    }
    if (toast) {
      const rise = (60 - toast.t) * 0.6;
      text(toast.text, toast.x, toast.y - 24 - rise, { size: 10, color: toast.c, alpha: Math.min(1, toast.t / 20) });
    }
    if (banner) drawBanner();
  }

  function drawBanner() {
    const m = medalFor(banner.tier);
    const age = 170 - banner.t;
    if (banner.t < 30 && (banner.t >> 2) % 2) return;     // blink out
    const drop = Math.max(0, 6 - Math.floor(age / 2)) * 12;
    const y = 104 - drop, hgt = banner.newSkin ? 120 : 98;
    ctx.save(); ctx.globalAlpha = 0.92;
    pixelBox(42, y, W - 84, hgt, T.panel, m.c);
    ctx.restore();
    medalIcon(m, 84, y + 40);
    text(`${banner.tier * MILESTONE}!`, 214, y + 24, { size: 20, color: m.c });
    text(`${m.name} MEDAL`, 214, y + 50, { size: 10, color: C.cream });
    text(`Huy chương ${m.vi}`, 214, y + 68, { size: 18, color: T.text, font: FONT_BODY });
    text(`+${banner.bonus} GEMS · +SHIELD`, W / 2, y + 86, { size: 18, color: C.gem, font: FONT_BODY });
    if (banner.newSkin) text(`NEW SKIN: ${banner.newSkin}`, W / 2, y + 106, { size: 10, color: C.gold });
  }

  function drawReady() {
    const bob = (Math.floor(bird.t / 20) % 2) * P;
    text('NIGHT', W / 2, 96 + bob, { size: 40, color: T.cap[1] });
    text('GLIDE', W / 2, 144 + bob, { size: 40, color: C.coral });
    text('Cánh chim đêm', W / 2, 182, { size: 24, color: C.cream, font: FONT_BODY });
    // Scene tag
    text(`· ${T.name} ·`, W / 2, 216, { size: 10, color: T.text });
    text(T.vi, W / 2, 234, { size: 18, color: T.text, font: FONT_BODY });

    // Skin selector
    const list = ownedList(), can = list.length > 1;
    arrow(84, SKIN_Y, -1, can ? C.cream : 'rgba(255,241,214,0.25)');
    arrow(316, SKIN_Y, 1, can ? C.cream : 'rgba(255,241,214,0.25)');
    text(SKINS[skin].name, W / 2, SKIN_Y - 6, { size: 12, color: C.cream });
    text(can ? `Skin ${list.indexOf(skin) + 1}/${list.length} · đổi màu chim` : `Reach ${MILESTONE} or visit the shop`, W / 2, SKIN_Y + 14, { size: 18, color: T.text, font: FONT_BODY });

    if (Math.floor(bird.t / 30) % 2 === 0) {
      text('PRESS SPACE', W / 2, 360, { size: 14 });
      text('/ CLICK TO PLAY', W / 2, 384, { size: 14 });
    }
    text('Nhấn Space / Chạm màn hình để bắt đầu', W / 2, 414, { size: 20, color: T.text, font: FONT_BODY });
    text(`BEST ${best}`, W / 2 - 56, 444, { size: 12, color: '#FFE3A8' });
    icon(GEM_IMG, W / 2 + 16, 433);
    text(String(gemsTotal), W / 2 + 44, 444, { size: 12, align: 'left' });
    shopButton(READY_SHOP);
    drawStock(15, 66, true);
  }

  function shopButton(r) {
    pixelBox(r.x, r.y, r.w, r.h, C.gold, C.outline);
    icon(GEM_IMG, r.x + 16, r.y + 9, 3);
    text('SHOP', r.x + r.w / 2 + 14, r.y + 15, { size: 12, color: C.outline, shadow: null });
    text('Cửa hàng', r.x + r.w / 2 + 14, r.y + 31, { size: 16, color: C.outline, font: FONT_BODY, shadow: null });
  }

  function shieldIcon(x, y) {
    x = snap(x); y = snap(y);
    ctx.fillStyle = C.outline; ctx.fillRect(x, y, 21, 24);
    ctx.fillStyle = C.shield; ctx.fillRect(x + 3, y + 3, 15, 12);
    ctx.fillRect(x + 6, y + 15, 9, 3); ctx.fillRect(x + 9, y + 18, 3, 3);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x + 6, y + 6, 3, 6);
  }

  // Start-of-flight boosts waiting to be used
  function drawStock(x, y, vertical = false) {
    const step = () => { if (vertical) y += 30; else x += 66; };
    if (stock.shield > 0) { shieldIcon(x, y); text(`×${stock.shield}`, x + 27, y + 12, { size: 10, align: 'left' }); step(); }
    if (stock.magnet > 0) { icon(MAGNET_IMG, x, y); text(`×${stock.magnet}`, x + 27, y + 12, { size: 10, align: 'left' }); }
  }

  function drawShop() {
    ctx.fillStyle = 'rgba(14,10,31,0.72)'; ctx.fillRect(0, 0, W, H);
    text('SHOP', W / 2, 46, { size: 26, color: C.gold });
    text('Cửa hàng · tiêu đá quý của bạn', W / 2, 74, { size: 18, color: T.text, font: FONT_BODY });
    icon(GEM_IMG, 300, 81);
    text(String(gemsTotal), 328, 92, { size: 12, align: 'left', color: C.gem });
    drawStock(18, 81);

    SHOP_ROWS.forEach((row, idx) => {
      const y = SHOP_Y0 + idx * ROW_H;
      const st = rowStatus(row);
      const sel = idx === shopSel;
      pixelBox(21, y, 358, ROW_H - 4, T.panel, sel ? C.gold : 'rgba(201,188,255,0.35)', false);
      let name, sub;
      if (row.kind === 'skin') {
        const sk = SKINS[row.i];
        icon(SKIN_SPRITES[row.i].frames[1], 30, y + 4, 2);
        name = sk.name;
        sub = st.owned ? 'Owned · Đã sở hữu' : sk.tier ? `Free at ${sk.tier * MILESTONE} pts · or buy` : 'Shop exclusive · Độc quyền';
      } else {
        if (row.kind === 'shield') shieldIcon(36, y + 7); else icon(MAGNET_IMG, 36, y + 8);
        name = BOOSTS[row.kind].name;
        sub = `${BOOSTS[row.kind].vi} · có ${stock[row.kind]}`;
      }
      text(name, 78, y + 13, { size: 10, align: 'left', color: C.cream });
      text(sub, 78, y + 28, { size: 16, align: 'left', color: T.text, font: FONT_BODY, shadow: null });

      const bx = 282, by = y + 5, bw = 88, bh = 28;
      const afford = st.price === 0 || gemsTotal >= st.price;
      const fill = st.owned ? (skin === row.i ? 'rgba(201,188,255,0.25)' : T.cap[0]) : st.full ? 'rgba(201,188,255,0.25)' : afford ? C.gold : 'rgba(255,107,91,0.45)';
      pixelBox(bx, by, bw, bh, fill, C.outline, false);
      if (st.owned || st.full) {
        text(st.label, bx + bw / 2, by + 15, { size: 9, color: C.outline, shadow: null });
      } else {
        icon(GEM_IMG, bx + 8, by + 4, 3);
        text(st.label, bx + 34, by + 15, { size: 10, align: 'left', color: C.outline, shadow: null });
      }
    });

    if (shopMsg) {
      const y = SHOP_Y0 + shopMsg.row * ROW_H + 19;
      ctx.save(); ctx.globalAlpha = Math.min(1, shopMsg.t / 20);
      pixelBox(60, y - 18, 280, 36, C.outline, shopMsg.c, false);
      text(shopMsg.text, W / 2, y, { size: 10, color: shopMsg.c, shadow: null });
      ctx.restore();
    }

    pixelBox(SHOP_BACK.x, SHOP_BACK.y, SHOP_BACK.w, SHOP_BACK.h, T.cap[0], C.outline);
    text('BACK', W / 2, SHOP_BACK.y + 15, { size: 12, color: C.outline, shadow: null });
    text('Quay lại', W / 2, SHOP_BACK.y + 31, { size: 16, color: C.outline, font: FONT_BODY, shadow: null });
  }

  function drawOver() {
    if (overTimer < 4) return;
    const k = Math.min(1, overTimer / 24);
    const py = snap(118 - Math.round((1 - k) * 8) * 12);
    text('GAME OVER', W / 2, py - 36, { size: 30, color: C.coral });

    pixelBox(51, py, W - 102, 222, T.panel, T.cap[1]);
    text('SCORE · ĐIỂM', W / 2, py + 24, { size: 20, color: T.text, font: FONT_BODY, shadow: null });
    text(String(score), W / 2, py + 52, { size: 28, color: C.cream });
    text('HIGH SCORE · KỶ LỤC', W / 2, py + 82, { size: 20, color: T.text, font: FONT_BODY, shadow: null });
    text(String(best), W / 2, py + 108, { size: 20, color: '#FFE3A8' });
    ctx.fillStyle = T.text;
    for (let i = -66; i < 66; i += 2 * P) ctx.fillRect(snap(W / 2 + i), py + 130, P, P);

    const m = medalFor(tierRun);
    if (m) {
      medalIcon(m, 90, py + 160);
      text(`${m.name} MEDAL`, 116, py + 156, { size: 10, align: 'left', color: m.c });
      text(`Huy chương ${m.vi}`, 116, py + 174, { size: 18, align: 'left', color: T.text, font: FONT_BODY, shadow: null });
    } else {
      text(`Reach ${MILESTONE} for a medal`, W / 2, py + 160, { size: 18, color: T.text, font: FONT_BODY, shadow: null });
      text(`Đạt ${MILESTONE} điểm để nhận huy chương`, W / 2, py + 176, { size: 18, color: T.text, font: FONT_BODY, shadow: null });
    }
    icon(GEM_IMG, 78, py + 192);
    text(`+${gemsRun}`, 106, py + 203, { size: 12, align: 'left', color: C.gem });
    text(`TOTAL ${gemsTotal}`, W - 78, py + 203, { size: 18, align: 'right', color: T.text, font: FONT_BODY, shadow: null });

    if (isNewBest && score > 0 && Math.floor(overTimer / 20) % 2 === 0) {
      pixelBox(W - 126, py - 14, 66, 30, C.coral, C.outline, false);
      text('NEW', W - 93, py + 2, { size: 12, color: C.cream, shadow: null });
    }

    if (overReady()) {
      const by = py + 240;
      if (k === 1) shopButton(OVER_SHOP);
      pixelBox(W / 2 - 96, by, 192, 48, T.cap[0], C.outline);
      text('REPLAY', W / 2, by + 18, { size: 14, color: C.outline, shadow: null });
      text('Chơi lại · cảnh mới', W / 2, by + 36, { size: 18, color: C.outline, font: FONT_BODY, shadow: null });
    }
  }

  // Purchase sparkles drawn above the shop overlay
  function drawShopParticles() {
    for (const p of particles) { ctx.fillStyle = p.c || C.cream; ctx.fillRect(snap(p.x), snap(p.y), p.big ? 6 : 3, p.big ? 6 : 3); }
  }

  function render() {
    b.clearRect(0, 0, LW, LH);
    drawSky();
    drawRidges();
    drawWeather();
    drawColumns();
    drawItems();
    drawGround();
    drawParticles();
    drawBird();

    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(buf, 0, 0, LW * P, LH * P);
    if (state === STATE.READY) drawReady();
    else if (state === STATE.PLAY) drawHUD();
    else if (state === STATE.SHOP) { drawShop(); drawShopParticles(); }
    else drawOver();
    if (flash > 0) { ctx.fillStyle = `rgba(255,241,214,${Math.ceil(flash * 3) / 3 * 0.8})`; ctx.fillRect(0, 0, W, H); }
  }

  // ───────────────────────── Loop ─────────────────────────
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 250);
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    render();
    requestAnimationFrame(loop);
  }

  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
