<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Night Glide — Cánh chim đêm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #120C2E;
    --mint: #7EF0C8;
    --white: #FFFFFF;
    --outline: #1A1033;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--night);
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, transparent 2px 6px);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Press Start 2P", "Courier New", monospace;
  }
  #stage {
    position: relative;
    aspect-ratio: 2 / 3;
    height: min(calc(100vh - 24px), calc(150vw - 36px));
    max-height: 900px;
    box-shadow: 0 0 0 4px #0E0A1F, 0 0 0 8px #7EF0C8, 12px 12px 0 8px #0E0A1F;
    border-radius: 0;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; image-rendering: pixelated; image-rendering: crisp-edges; }
  #back {
    position: absolute; top: 2.5%; left: 3.5%;
    height: 6%; display: flex; align-items: center;
    padding: 0 3%;
    border: 3px solid #0E0A1F;
    box-shadow: inset 0 0 0 2px var(--mint);
    background: #22164A;
    color: var(--white); text-decoration: none;
    font-family: "Press Start 2P", "Courier New", monospace;
    font-size: clamp(7px, 1.2vh, 10px);
  }
  #mute {
    position: absolute; top: 2.5%; right: 3.5%;
    width: 9%; aspect-ratio: 1;
    border: 3px solid #0E0A1F;
    box-shadow: inset 0 0 0 2px var(--mint);
    background: #22164A;
    color: var(--white);
    font-family: "Press Start 2P", "Courier New", monospace;
    font-size: clamp(9px, 1.6vh, 14px);
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Night Glide game"></canvas>
  <a id="back" href="index.html" aria-label="Back">← Back</a>
  <button id="mute" type="button" aria-label="Toggle sound">♪</button>
</div>

<script>
(() => {
  'use strict';

  // ───────────────────────── Specs ─────────────────────────
  const W = 400, H = 600, FPS = 60, STEP = 1000 / FPS;
  const GROUND_H = 90;
  const GROUND_Y = H - GROUND_H;

  const BIRD_W = 60, BIRD_H = 45;
  const BIRD_X = 90;
  const GRAVITY = 0.5;
  const FLY_SPEED = -8;
  const MAX_FALL = 11;

  const COL_W = 72;          // column (pillar) width
  const GAP = 160;           // blank gap between upper and lower column
  const DISTANCE = 200;      // horizontal distance between consecutive columns
  const SPEED = 2;           // scroll speed (px per frame)
  const GAP_MIN_Y = 70;      // top of gap never higher than this
  const GAP_MAX_Y = GROUND_Y - GAP - 50;

  const C = {
    sky1: '#120B2B', sky2: '#1F1248', sky3: '#33196A', sky4: '#55247E', sky5: '#86357F',
    star: '#FFF1D6', moon: '#FFE3A8', moonDark: '#E0B872', cloud: '#6A3F94', cloudShade: '#4A2A78',
    hillFar: '#2A1856', hillFarTop: '#4A2F86', hillNear: '#170E36',
    stone: '#8C8FB8', stoneLight: '#C4C8E8', stoneDark: '#5A5C8A', mortar: '#6B6E9C',
    mint: '#3FD9A8', mintLight: '#7EF0C8', mintDark: '#1C8F78',
    coral: '#FF6B5B', coralLight: '#FFA08F', coralDark: '#C8433D', beak: '#FFC23D',
    cream: '#FFF1D6', outline: '#0E0A1F', lilac: '#C9BCFF',
    ground: '#2A1A4F', groundTile: '#33226A', panel: '#22164A',
  };

  const STATE = { READY: 'ready', PLAY: 'play', OVER: 'over' };
  const HS_KEY = 'night-glide-best';

  // ───────────────────────── Canvas ─────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ───────────────────────── Audio (synthesised) ─────────────────────────
  const Sound = (() => {
    let ac = null, muted = false;
    const ensure = () => {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ac = new AC();
      }
      if (ac && ac.state === 'suspended') ac.resume();
      return ac;
    };
    function tone({ type = 'sine', from, to, dur, vol = 0.2, delay = 0 }) {
      if (muted || !ensure()) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(from, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }
    function noise(dur, vol) {
      if (muted || !ensure()) return;
      const len = Math.floor(ac.sampleRate * dur);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 900;
      g.gain.value = vol;
      src.buffer = buf;
      src.connect(f).connect(g).connect(ac.destination);
      src.start();
    }
    return {
      unlock: ensure,
      wing:  () => { tone({ type: 'triangle', from: 520, to: 880, dur: 0.09, vol: 0.12 }); },
      point: () => { tone({ from: 988, dur: 0.09, vol: 0.16 }); tone({ from: 1319, dur: 0.18, vol: 0.16, delay: 0.08 }); },
      hit:   () => { noise(0.18, 0.5); tone({ type: 'square', from: 220, to: 70, dur: 0.25, vol: 0.12 }); },
      die:   () => { tone({ type: 'sawtooth', from: 440, to: 110, dur: 0.5, vol: 0.08, delay: 0.22 }); },
      toggle() { muted = !muted; return muted; },
    };
  })();

  // ───────────────────────── World layers (parallax) ─────────────────────────
  const rand = (a, b) => a + Math.random() * (b - a);

  const clouds = Array.from({ length: 5 }, (_, i) => ({
    x: i * 110 + rand(0, 60), y: rand(40, 200), s: rand(0.6, 1.2),
  }));
  let bgOffset = 0, hillOffset = 0, seaOffset = 0, groundOffset = 0;

  // ───────────────────────── Game objects ─────────────────────────
  const bird = { x: BIRD_X, y: 0, vy: 0, rot: 0, flapTimer: 0, frame: 0, t: 0 };
  let columns = [];
  let particles = [];
  let state = STATE.READY;
  let score = 0;
  let best = 0;
  try { best = Number(localStorage.getItem(HS_KEY)) || 0; } catch (e) { /* storage unavailable */ }
  let isNewBest = false;
  let overTimer = 0;       // frames since game over (input lock + panel animation)
  let flash = 0;           // white flash on impact
  let scorePulse = 0;

  function reset() {
    bird.y = H * 0.42; bird.vy = 0; bird.rot = 0; bird.flapTimer = 0; bird.t = 0;
    columns = [];
    particles = [];
    score = 0; isNewBest = false; overTimer = 0; flash = 0;
    state = STATE.READY;
  }

  function spawnColumn(x) {
    const gapY = Math.round(rand(GAP_MIN_Y, GAP_MAX_Y));
    columns.push({ x, gapY, passed: false });
  }

  function flap() {
    bird.vy = FLY_SPEED;
    bird.flapTimer = 14;
    Sound.wing();
    for (let i = 0; i < 4; i++) {
      particles.push({ x: bird.x - 18, y: bird.y + rand(-6, 10), vx: rand(-2.2, -0.8), vy: rand(-0.6, 0.8), life: 26, max: 26 });
    }
  }

  function gameOver() {
    if (state === STATE.OVER) return;
    state = STATE.OVER;
    flash = 1;
    Sound.hit(); Sound.die();
    if (score > best) { best = score; isNewBest = true; try { localStorage.setItem(HS_KEY, String(best)); } catch (e) { /* storage unavailable */ } }
  }

  // ───────────────────────── Input ─────────────────────────
  function press() {
    Sound.unlock();
    if (state === STATE.READY) {
      state = STATE.PLAY;
      spawnColumn(W + 40);
      flap();
    } else if (state === STATE.PLAY) {
      flap();
    } else if (state === STATE.OVER && overTimer > 35 && bird.y + BIRD_H / 2 >= GROUND_Y - 1) {
      reset();
    }
  }
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  const muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
  document.getElementById('back').addEventListener('pointerdown', e => e.stopPropagation());
  muteBtn.addEventListener('click', () => {
    const m = Sound.toggle();
    muteBtn.textContent = m ? 'X' : '♪';
    muteBtn.blur();
  });

  // ───────────────────────── Collision ─────────────────────────
  // Slightly inset hitbox so contact feels fair with the rounded sprite.
  function birdBox() {
    const insetX = 9, insetY = 8;
    return { l: bird.x - BIRD_W / 2 + insetX, r: bird.x + BIRD_W / 2 - insetX, t: bird.y - BIRD_H / 2 + insetY, b: bird.y + BIRD_H / 2 - insetY };
  }
  function hitsColumn(c, bx) {
    if (bx.r <= c.x || bx.l >= c.x + COL_W) return false;
    return bx.t < c.gapY || bx.b > c.gapY + GAP;
  }

  // ───────────────────────── Update (fixed 60 FPS step) ─────────────────────────
  function update() {
    bird.t++;
    if (bird.flapTimer > 0) bird.flapTimer--;
    bird.frame = bird.flapTimer > 0 ? Math.floor(bird.t / 3) % 3 : 1;   // fast beats when flapping, glide otherwise

    if (state !== STATE.OVER) {
      bgOffset = (bgOffset + SPEED * 0.15) % (134 * 3);
      hillOffset = (hillOffset + SPEED * 0.35) % (256 * 3);
      seaOffset = (seaOffset + SPEED * 0.6) % (256 * 3);
      groundOffset = (groundOffset + SPEED) % 24;
      for (const c of clouds) { c.x -= SPEED * 0.15 * c.s; if (c.x < -90) { c.x = W + rand(10, 80); c.y = rand(40, 200); } }
    }

    if (state === STATE.READY) {
      // Gentle hover — no gravity until the first input.
      bird.y = H * 0.42 + Math.sin(bird.t / 12) * 7;
      bird.rot = 0;
      if (bird.t % 30 === 0) bird.flapTimer = 12;
    } else if (state === STATE.PLAY) {
      bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
      bird.y += bird.vy;
      bird.rot = Math.max(-0.45, Math.min(1.35, bird.vy * 0.09));

      // Columns
      for (const c of columns) c.x -= SPEED;
      const last = columns[columns.length - 1];
      if (last && last.x <= W + 40 - (COL_W + DISTANCE)) spawnColumn(last.x + COL_W + DISTANCE);
      columns = columns.filter(c => c.x + COL_W > -10);

      // Scoring: bird passes the column's trailing edge
      for (const c of columns) {
        if (!c.passed && bird.x > c.x + COL_W) {
          c.passed = true; score++; scorePulse = 1; Sound.point();
        }
      }

      // Collisions
      const bx = birdBox();
      if (bx.t <= 0) { bird.y = BIRD_H / 2 - 8; gameOver(); }                 // ceiling
      else if (bx.b >= GROUND_Y) { bird.y = GROUND_Y - BIRD_H / 2 + 8; gameOver(); } // ground
      else if (columns.some(c => hitsColumn(c, bx))) gameOver();             // columns
    } else if (state === STATE.OVER) {
      overTimer++;
      // Bird tumbles to the ground; world is frozen.
      if (bird.y + BIRD_H / 2 < GROUND_Y) {
        bird.vy = Math.min(bird.vy + GRAVITY * 1.4, MAX_FALL * 1.3);
        bird.y = Math.min(bird.y + bird.vy, GROUND_Y - BIRD_H / 2);
        bird.rot = Math.min(bird.rot + 0.12, Math.PI / 2);
      } else {
        bird.rot = Math.PI / 2;
      }
    }

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
    particles = particles.filter(p => p.life > 0);
    if (flash > 0) flash = Math.max(0, flash - 0.06);
    if (scorePulse > 0) scorePulse = Math.max(0, scorePulse - 0.07);
  }

  // ───────────────────────── Drawing (retro pixel art) ─────────────────────────
  // The world is painted on a low-resolution buffer (1 art pixel = 3 screen px)
  // and scaled up with nearest-neighbour sampling. UI text uses pixel fonts at full res.
  const P = 3;
  const LW = Math.ceil(W / P), LH = H / P;       // 134 × 200
  const LG = GROUND_Y / P;                        // ground line in art pixels (170)
  const L = v => Math.round(v / P);
  const buf = document.createElement('canvas');
  buf.width = LW; buf.height = LH;
  const b = buf.getContext('2d');
  b.imageSmoothingEnabled = false;

  const FONT_HEAD = '"Press Start 2P", "Courier New", monospace';
  const FONT_BODY = '"VT323", "Courier New", monospace';
  if (document.fonts && document.fonts.load) {
    document.fonts.load(`16px "Press Start 2P"`).catch(() => {});
    document.fonts.load(`20px "VT323"`).catch(() => {});
  }

  const rect = (x, y, w, h, c) => { b.fillStyle = c; b.fillRect(x, y, w, h); };

  // ── Sprites from character maps ──
  function sprite(rows, pal) {
    const h = rows.length, w = Math.max(...rows.map(r => r.length));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    rows.forEach((r, y) => [...r].forEach((ch, x) => {
      if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
    }));
    return c;
  }
  const BIRD_PAL = { K: C.outline, R: C.coral, r: C.coralDark, L: C.coralLight, W: C.cream, E: C.outline, w: '#FFFFFF', Y: C.beak, y: '#E09A1E', P: '#FF9EB5' };
  const BODY = [
    '.......KKKKKK.......',
    '.....KKLLLLRRKK.....',
    '....KLLRRRRRwwwK....',
    '...KLRRRRRRwwwwwK...',
    '..KRRRRRRRRwwKEwK...',
    '..KRRRRRRRRwwKEwK...',
    'KKRRRRRRRRRRwwwwKKK.',
    'KrKRRRRRRRRRRwwKYYYK',
    'KrrKRRRRRRRRRRKyyyyK',
    '.KrRRRRRRRRRRPKYYYK.',
    '..KrRRRRWWWWWRRKKK..',
    '..KrrRWWWWWWWWRK....',
    '...KrrWWWWWWWWK.....',
    '....KKrrrrrrKK......',
    '......KKKKKK........',
  ];
  const DEAD = BODY.map((r, i) => (i === 4 || i === 5) ? r.replace('KEwK', i === 4 ? 'KwKK' : 'KKwK') : r);
  const WINGS = [
    { x: 2, y: 1, rows: ['KK.......', 'KWK......', 'KWWKK....', 'KWWWWK...', '.KWWWWK..', '..KKKKK..'] },
    { x: 2, y: 6, rows: ['.KKKKK...', 'KWWWWWK..', 'KWWWWWWK.', '.KKKKKK..'] },
    { x: 2, y: 8, rows: ['.KKKKKK..', '.KWWWWWK.', '..KWWWWK.', '...KWWK..', '....KK...'] },
  ];
  function composeBird(bodyRows, wing) {
    const c = document.createElement('canvas'); c.width = 20; c.height = 15;
    const g = c.getContext('2d');
    g.drawImage(sprite(bodyRows, BIRD_PAL), 0, 0);
    g.drawImage(sprite(wing.rows, BIRD_PAL), wing.x, wing.y);
    return c;
  }
  const BIRD_FRAMES = WINGS.map(w => composeBird(BODY, w));
  const BIRD_DEAD = composeBird(DEAD, WINGS[1]);

  // ── Seamless parallax ridges (period 256 art px) ──
  const RIDGE = 256;
  const ridge = (amp, base, k1, k2, ph) => Array.from({ length: RIDGE }, (_, x) =>
    Math.round(base + Math.sin(2 * Math.PI * k1 * x / RIDGE + ph) * amp + Math.sin(2 * Math.PI * k2 * x / RIDGE) * amp * 0.35));
  const FAR = ridge(9, 36, 3, 11, 0.4);    // heights above ground line
  const NEAR = ridge(5, 15, 5, 17, 1.7);

  const stars = Array.from({ length: 34 }, () => ({ x: Math.floor(rand(0, LW)), y: Math.floor(rand(4, 110)), p: Math.floor(rand(0, 120)), big: Math.random() < 0.2 }));

  const SKY = [  // [colour, height] top → horizon, with dithered seams between bands
    [C.sky1, 46], [C.sky2, 40], [C.sky3, 34], [C.sky4, 28], [C.sky5, 22],
  ];

  function drawSky() {
    let y = 0;
    SKY.forEach(([col, h], i) => {
      rect(0, y, LW, h, col);
      const next = SKY[i + 1];
      if (next) {        // two-row checker dither into the next band
        b.fillStyle = next[0];
        for (let x = 0; x < LW; x++) {
          if ((x & 1) === 0) b.fillRect(x, y + h - 2, 1, 1);
          if ((x & 1) === 1) b.fillRect(x, y + h - 1, 1, 1);
        }
      }
      y += h;
    });
    rect(0, y, LW, LG - y, C.sky5);

    // Stars — blink on a stepped cycle
    for (const s of stars) {
      const sx = ((s.x - Math.floor(bgOffset / P)) % LW + LW) % LW;
      if ((bird.t + s.p) % 120 < 100) {
        rect(sx, s.y, 1, 1, C.star);
        if (s.big && (bird.t + s.p) % 60 < 30) { rect(sx - 1, s.y, 3, 1, C.star); rect(sx, s.y - 1, 1, 3, C.star); }
      }
    }

    // Moon (pixel disc + craters)
    const mx = 112 - Math.floor(bgOffset / P / 5), my = 74, r = 10;
    for (let dy = -r; dy <= r; dy++) {
      const half = Math.floor(Math.sqrt(r * r - dy * dy));
      rect(mx - half, my + dy, half * 2 + 1, 1, C.moon);
    }
    rect(mx - 4, my - 4, 3, 2, C.moonDark); rect(mx + 3, my + 2, 2, 2, C.moonDark); rect(mx - 2, my + 5, 2, 1, C.moonDark);
    // Halo ring
    b.fillStyle = 'rgba(255,227,168,0.18)';
    for (let dy = -r - 3; dy <= r + 3; dy++) {
      const half = Math.floor(Math.sqrt((r + 3) ** 2 - dy * dy));
      b.fillRect(mx - half, my + dy, half * 2 + 1, 1);
    }

    // Blocky clouds
    for (const c of clouds) {
      const cx = Math.round(c.x / P), cy = Math.round(c.y / P) + 10, s = c.s > 0.9 ? 2 : 1;
      rect(cx - 6 * s, cy, 14 * s, 3, C.cloud);
      rect(cx - 3 * s, cy - 2, 8 * s, 2, C.cloud);
      rect(cx - 6 * s, cy + 3, 14 * s, 1, C.cloudShade);
    }
  }

  function drawHills() {
    const fo = Math.floor(hillOffset / P), no = Math.floor(seaOffset / P);
    for (let x = 0; x < LW; x++) {
      const hf = FAR[(x + fo) % RIDGE];
      rect(x, LG - hf, 1, hf, C.hillFar);
      rect(x, LG - hf, 1, 1, C.hillFarTop);
      const hn = NEAR[(x + no) % RIDGE];
      rect(x, LG - hn, 1, hn, C.hillNear);
    }
  }

  function drawPillar(x, top, bottom, capAtBottom) {
    // x, top, bottom are in art pixels
    const w = COL_W / P;          // 24
    if (bottom <= top) return;
    rect(x, top, w, bottom - top, C.stone);
    rect(x + 2, top, 3, bottom - top, C.stoneLight);
    rect(x + w - 4, top, 3, bottom - top, C.stoneDark);
    // Brick mortar (aligned to the cap so it scrolls with the pillar)
    const anchor = capAtBottom ? bottom : top;
    for (let y = top; y < bottom; y++) {
      const d = y - anchor, ry = ((d % 6) + 6) % 6, course = Math.floor(d / 6);
      if (ry === 0) rect(x + 1, y, w - 2, 1, C.mortar);
      else if (course & 1) rect(x + 12, y, 1, 1, C.mortar);
      else { rect(x + 6, y, 1, 1, C.mortar); rect(x + 18, y, 1, 1, C.mortar); }
    }
    rect(x, top, 1, bottom - top, C.outline);
    rect(x + w - 1, top, 1, bottom - top, C.outline);

    // Crystal cap
    const cw = w + 4, ch = 6, cx = x - 2;
    const cy = capAtBottom ? bottom - ch : top;
    rect(cx, cy, cw, ch, C.outline);
    rect(cx + 1, cy + 1, cw - 2, ch - 2, C.mint);
    rect(cx + 2, cy + 1, cw - 8, 1, C.mintLight);
    rect(cx + cw - 4, cy + 1, 2, ch - 2, C.mintDark);
    // Gem studs
    for (let gx = cx + 4; gx < cx + cw - 4; gx += 6) rect(gx, cy + 3, 2, 1, C.mintLight);
  }

  function drawColumns() {
    for (const c of columns) {
      const x = Math.round(c.x / P);
      drawPillar(x, -2, L(c.gapY), true);
      drawPillar(x, L(c.gapY + GAP), LG, false);
    }
  }

  function drawGround() {
    const off = Math.floor(groundOffset / P) % 8;
    rect(0, LG, LW, LH - LG, C.ground);
    rect(0, LG, LW, 1, C.outline);
    rect(0, LG + 1, LW, 2, C.mintLight);
    // Grass tufts
    for (let x = -off; x < LW + 8; x += 8) { rect(x + 1, LG + 3, 2, 1, C.mint); rect(x + 5, LG + 3, 1, 2, C.mintDark); }
    rect(0, LG + 5, LW, 1, C.outline);
    // Checker tiles
    for (let row = 0; row < 3; row++) {
      for (let x = -off - (row & 1 ? 4 : 0); x < LW + 8; x += 8) {
        rect(x, LG + 7 + row * 8, 4, 4, C.groundTile);
      }
    }
  }

  function drawBird() {
    const img = state === STATE.OVER ? BIRD_DEAD : BIRD_FRAMES[bird.frame];
    const cx = Math.round(bird.x / P), cy = Math.round(bird.y / P);
    // Snap rotation to 22.5° steps for a hand-drawn feel
    const rot = Math.round(bird.rot / (Math.PI / 8)) * (Math.PI / 8);
    b.save();
    b.translate(cx, cy);
    b.rotate(rot);
    b.drawImage(img, -10, -8);
    b.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      if (p.life / p.max < 0.3 && p.life % 2) continue;
      rect(Math.round(p.x / P), Math.round(p.y / P), 1, 1, p.life > p.max / 2 ? C.cream : C.mintLight);
    }
  }

  // ── Full-resolution UI helpers ──
  const snap = v => Math.round(v / P) * P;
  function text(str, x, y, { size = 16, color = C.cream, align = 'center', font = FONT_HEAD, shadow = C.outline, alpha = 1 } = {}) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `${size}px ${font}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, snap(x) + P, snap(y) + P); }
    ctx.fillStyle = color;
    ctx.fillText(str, snap(x), snap(y));
    ctx.restore();
  }
  // Box with notched pixel corners and a 3px border
  function pixelBox(x, y, w, h, fill, border, shadow = true) {
    x = snap(x); y = snap(y); w = snap(w); h = snap(h);
    if (shadow) { ctx.fillStyle = 'rgba(14,10,31,0.6)'; ctx.fillRect(x + P * 2, y + P * 2, w, h); }
    ctx.fillStyle = border;
    ctx.fillRect(x + P, y, w - 2 * P, h);
    ctx.fillRect(x, y + P, w, h - 2 * P);
    ctx.fillStyle = fill;
    ctx.fillRect(x + 2 * P, y + P, w - 4 * P, h - 2 * P);
    ctx.fillRect(x + P, y + 2 * P, w - 2 * P, h - 4 * P);
  }

  function drawUI() {
    if (state === STATE.READY) {
      const bob = (Math.floor(bird.t / 20) % 2) * P;
      text('NIGHT', W / 2, 104 + bob, { size: 40, color: C.mintLight });
      text('GLIDE', W / 2, 152 + bob, { size: 40, color: C.coral });
      text('Cánh chim đêm', W / 2, 192, { size: 24, color: C.lilac, font: FONT_BODY });

      if (Math.floor(bird.t / 30) % 2 === 0) {
        text('PRESS SPACE', W / 2, 360, { size: 14 });
        text('/ CLICK TO PLAY', W / 2, 384, { size: 14 });
      }
      text('Nhấn Space / Chạm màn hình để bắt đầu', W / 2, 414, { size: 20, color: C.lilac, font: FONT_BODY });
      if (best > 0) text(`BEST ${best}`, W / 2, 456, { size: 12, color: C.moon });
      return;
    }

    if (state === STATE.PLAY) {
      text(String(score), W / 2, 66 + (scorePulse > 0.5 ? -P : 0), { size: 36, color: C.cream });
      return;
    }

    // Game over: panel drops in with stepped motion
    const k = Math.min(1, overTimer / 24);
    const py = snap(150 + Math.round((1 - k) * 8) * -12);
    if (overTimer < 4) return;
    text('GAME OVER', W / 2, py - 40, { size: 30, color: C.coral });

    pixelBox(57, py, W - 114, 174, C.panel, C.mintLight);
    text('SCORE · ĐIỂM', W / 2, py + 26, { size: 22, color: C.lilac, font: FONT_BODY, shadow: null });
    text(String(score), W / 2, py + 58, { size: 30, color: C.cream });
    ctx.fillStyle = C.lilac;
    for (let i = -48; i < 48; i += 2 * P) ctx.fillRect(snap(W / 2 + i), py + 87, P, P);
    text('HIGH SCORE · KỶ LỤC', W / 2, py + 108, { size: 22, color: C.lilac, font: FONT_BODY, shadow: null });
    text(String(best), W / 2, py + 140, { size: 24, color: C.moon });
    if (isNewBest && score > 0 && Math.floor(overTimer / 20) % 2 === 0) {
      pixelBox(W - 120, py - 12, 66, 30, C.coral, C.outline, false);
      text('NEW', W - 87, py + 4, { size: 12, color: C.cream, shadow: null });
    }

    const ready = overTimer > 35 && bird.y + BIRD_H / 2 >= GROUND_Y - 1;
    if (ready) {
      const by = py + 198;
      pixelBox(W / 2 - 96, by, 192, 48, C.mint, C.outline);
      text('REPLAY', W / 2, by + 18, { size: 14, color: C.outline, shadow: null });
      text('Chơi lại', W / 2, by + 36, { size: 18, color: C.outline, font: FONT_BODY, shadow: null });
      text('Space / Click', W / 2, by + 72, { size: 20, color: C.lilac, font: FONT_BODY });
    }
  }

  function render() {
    b.clearRect(0, 0, LW, LH);
    drawSky();
    drawHills();
    drawColumns();
    drawGround();
    drawParticles();
    drawBird();

    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(buf, 0, 0, LW * P, LH * P);
    drawUI();
    if (flash > 0) { ctx.fillStyle = `rgba(255,241,214,${Math.ceil(flash * 3) / 3 * 0.8})`; ctx.fillRect(0, 0, W, H); }
  }

  // ───────────────────────── Loop ─────────────────────────
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 250);   // avoid spiral after tab switch
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    render();
    requestAnimationFrame(loop);
  }

  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
